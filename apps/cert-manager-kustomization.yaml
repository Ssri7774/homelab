# cert-manager gets its own Flux Kustomization (like Marga) so the CRD-ordering
# churn (ClusterIssuer/Certificate need cert-manager's CRDs + webhook first)
# retries in isolation and never fails the shared cluster-apps reconcile.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m       # cert-manager is already installed; this just applies config
  timeout: 5m
  prune: true
  wait: false             # don't gate on Certificate issuance; we watch it separately
  path: ./apps/cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
