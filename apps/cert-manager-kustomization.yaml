# cert-manager INSTALL (HelmRelease v1.21). wait:true + healthChecks so the
# separate cert-manager-config Kustomization (which dependsOn this) only applies
# ClusterIssuers/Certificate AFTER the CRDs + webhook are up.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  prune: true
  wait: true
  path: ./apps/cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: cert-manager
      namespace: cert-manager
    - apiVersion: apps/v1
      kind: Deployment
      name: cert-manager-webhook
      namespace: cert-manager
