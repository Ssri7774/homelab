apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: technitium-allow-dns
  namespace: flux-system
spec:
  podSelector:
    matchLabels:
      app: technitium
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
    - protocol: TCP
      port: 5380
