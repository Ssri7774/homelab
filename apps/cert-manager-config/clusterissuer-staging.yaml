# Staging issuer - use this FIRST to prove DNS-01 works without burning Let's
# Encrypt's strict production rate limits. Staging certs are untrusted (that's
# expected); once a cert issues from staging, switch the Certificate to prod.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: theboss@whatsoever.au
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
