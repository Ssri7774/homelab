# CNPG's own PodMonitor lacks release=kube-prometheus-stack, so Prometheus
# ignores it (measured on zitadel-pg). This one is selected.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: authentik-pg-scrape
  namespace: authentik
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: authentik-pg
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
