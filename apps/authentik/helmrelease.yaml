# Authentik, homelab SSO at https://auth.whatsoever.au (LAN + tailnet only:
# Technitium answers the name, there is NO Cloudflare public record for it).
#
# Chart pinned to 2026.8.6 (= app 2026.8.6), latest stable on 24 Nov 2026.
# Upgrade one minor at a time and read the release notes first; Authentik
# migrations are one-way.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 30m
  releaseName: authentik
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: authentik
      version: "2026.8.6"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: authentik
  values:
    global:
      # Off hp-master (memory-tight, flaky), same rule as every other app.
      affinity:
        nodeAffinity:
          type: hard
          matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist
      # Secrets come in as explicit env (env beats the chart's envFrom secret).
      env:
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef: {name: authentik-secrets, key: secret_key}
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef: {name: authentik-secrets, key: db_password}
        # First-start only: creates akadmin with this password, so the open
        # /if/flow/initial-setup/ window never exists on the LAN.
        - name: AUTHENTIK_BOOTSTRAP_PASSWORD
          valueFrom:
            secretKeyRef: {name: authentik-secrets, key: bootstrap_password}
      # verify-full against the CNPG CA, same posture as marga-pg (B-R1-11).
      # Mount ca.crt only: the CNPG CA Secret also holds ca.key.
      volumes:
        - name: pg-ca
          secret:
            secretName: authentik-pg-ca
            items:
              - {key: ca.crt, path: ca.crt}
      volumeMounts:
        - name: pg-ca
          mountPath: /etc/ssl/pgca
          readOnly: true

    # Non-secret config. The chart turns this into its own Secret of
    # AUTHENTIK_* vars; secret_key and postgresql.password are left empty here
    # on purpose (supplied by global.env above).
    authentik:
      log_level: info
      error_reporting:
        enabled: false
      postgresql:
        host: authentik-pg-rw.authentik.svc.cluster.local   # must match the cert SAN
        name: authentik
        user: authentik
        port: 5432
        sslmode: verify-full
        sslrootcert: /etc/ssl/pgca/ca.crt
      # email: fill in later (password reset, admin alerts). Needs an egress
      # rule only if the namespace egress is ever locked down.

    server:
      replicas: 1
      resources:
        requests: {cpu: 100m, memory: 512Mi}
        limits: {memory: 1Gi}
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - auth.whatsoever.au
        # no tls block: the *.whatsoever.au wildcard via TLSStore/default covers it
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          labels:
            release: kube-prometheus-stack

    worker:
      replicas: 1
      resources:
        requests: {cpu: 50m, memory: 384Mi}
        limits: {memory: 1Gi}

    postgresql:
      enabled: false          # external CNPG cluster above, not the demo DB
