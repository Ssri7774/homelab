# Authentik's secrets from Vault via the existing vault-backend
# ClusterSecretStore (KV v2, mount "kv", ESO 0.9.11 -> v1beta1, mount-relative
# remoteRef.key). Nothing sensitive is in Git. eso-policy already grants
# kv/data/* so no Vault policy change is needed.
#
# Vault path kv/homelab/authentik:
#   secret_key          cookie signing. Changing it logs everyone out.
#   db_password         the "authentik" Postgres role (CNPG initdb owner)
#   bootstrap_password  akadmin's password, read ONLY on the very first start.
#                       After that, change it in the UI; this value goes stale.
#
# Seed it once (run from the Synology deploy container or anywhere with vault):
#   SK=$(openssl rand -base64 60 | tr -d '\n')
#   DBP=$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 32)
#   BP=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
#   kubectl -n vault exec -i vault-vault-0 -- env SK="$SK" DBP="$DBP" BP="$BP" \
#     sh -c 'vault kv put kv/homelab/authentik secret_key="$SK" db_password="$DBP" bootstrap_password="$BP"'
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: authentik-secrets
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: authentik-secrets
    creationPolicy: Owner
    deletionPolicy: Retain          # a sealed Vault must not take SSO down
  data:
    - secretKey: secret_key
      remoteRef: {key: homelab/authentik, property: secret_key}
    - secretKey: db_password
      remoteRef: {key: homelab/authentik, property: db_password}
    - secretKey: bootstrap_password
      remoteRef: {key: homelab/authentik, property: bootstrap_password}
---
# The same DB password shaped as the basic-auth Secret CNPG's initdb wants, so
# Vault is the single source for the role password (no CNPG-generated value to
# copy back into Vault, unlike zitadel's admin_password coupling).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: authentik-pg-app
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: authentik-pg-app-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: authentik
        password: "{{ .db_password }}"
  data:
    - secretKey: db_password
      remoteRef: {key: homelab/authentik, property: db_password}
