# Backup credentials for authentik-pg -> Garage (ns marga-backup), copied from
# the zitadel pattern (apps/zitadel/backup.yaml).
#
# Garage key "authentik-pg": read+write+owner on bucket cnpg-authentik ONLY; it
# cannot see cnpg-marga / cnpg-zitadel / docs-mirror. Key pair lives in Vault
# kv/homelab/authentik (garage_access_key / garage_secret_key).
# The Garage CA is public material, read from Marga's kv/marga/backup ca_crt.
#
# NOT shipped offsite (decision 24 Nov 2026): cnpg-authentik is deliberately
# absent from marga-backup's offsite job, so Marga's restic repo / DEV-002
# scope is unchanged. The readable copy lives on the Synology only.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: authentik-pg-backup-s3
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-backend}
  target:
    name: authentik-pg-backup-s3
    creationPolicy: Owner
    deletionPolicy: Retain      # a sealed Vault must not stop WAL archiving
    template:
      engineVersion: v2
      data:
        ACCESS_KEY_ID: "{{ .ak }}"
        ACCESS_SECRET_KEY: "{{ .sk }}"
        REGION: us-east-1       # must equal Garage s3_region
        ca.crt: "{{ .ca }}"
  data:
    - {secretKey: ak, remoteRef: {key: homelab/authentik, property: garage_access_key}}
    - {secretKey: sk, remoteRef: {key: homelab/authentik, property: garage_secret_key}}
    - {secretKey: ca, remoteRef: {key: marga/backup, property: ca_crt}}
