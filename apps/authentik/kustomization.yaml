apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: authentik
resources:
  - namespace.yaml
  - externalsecret.yaml
  - backup-externalsecret.yaml   # Garage creds for authentik-pg backups (Vault kv/homelab/authentik)
  - postgres-cluster.yaml
  - backup.yaml                  # ObjectStore + daily ScheduledBackup -> Garage cnpg-authentik
  - podmonitor.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - middleware.yaml          # Traefik forward-auth, unused until an Ingress opts in
  - networkpolicy.yaml
