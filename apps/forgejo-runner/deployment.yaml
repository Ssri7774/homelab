apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo-runner
  labels:
    app: forgejo-runner
spec:
  replicas: 1
  strategy:
    type: Recreate            # single runner + DinD storage; don't run two at once
  selector:
    matchLabels:
      app: forgejo-runner
  template:
    metadata:
      labels:
        app: forgejo-runner
    spec:
      # Register once (writes /data/.runner from the shared secret), then the
      # daemon container reads that file. This runner's `daemon` has no --url;
      # registration is a separate create-runner-file step.
      initContainers:
        - name: register
          image: data.forgejo.org/forgejo/runner:11
          workingDir: /data                  # create-runner-file writes ./.runner here
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ ! -f /data/.runner ]; then
                forgejo-runner register --no-interactive \
                  --instance "$FORGEJO_URL" \
                  --token "$RUNNER_TOKEN" \
                  --name "$RUNNER_NAME" \
                  --labels "docker:docker://catthehacker/ubuntu:act-latest"
              fi
          env:
            - name: FORGEJO_URL
              value: http://forgejo.whatsoever.au/
            - name: RUNNER_NAME
              value: k3s-hp-master-runner
            - name: RUNNER_TOKEN               # registration token from Forgejo "Create new runner"
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner-creds
                  key: token
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: runner
          image: data.forgejo.org/forgejo/runner:11
          command: ["forgejo-runner", "daemon", "--config", "/config/config.yaml"]
          env:
            - name: DOCKER_HOST               # reach the DinD sidecar (config also sets this)
              value: tcp://localhost:2375
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
        # Docker-in-Docker: the daemon that builds the image. Privileged is
        # required for DinD. Isolated in this namespace; harden later if desired.
        - name: dind
          image: docker:dind
          securityContext:
            privileged: true
          args:
            - "--host=tcp://0.0.0.0:2375"     # non-TLS, pod-local only
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          volumeMounts:
            - name: dind-storage
              mountPath: /var/lib/docker
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          configMap:
            name: forgejo-runner-config
        - name: dind-storage
          emptyDir: {}
