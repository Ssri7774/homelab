apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo-runner
  labels:
    app: forgejo-runner
spec:
  replicas: 1
  strategy:
    type: Recreate            # single runner + DinD storage; don't run two at once
  selector:
    matchLabels:
      app: forgejo-runner
  template:
    metadata:
      labels:
        app: forgejo-runner
    spec:
      # Register once (writes /data/.runner from the shared secret), then the
      # daemon container reads that file. This runner's `daemon` has no --url;
      # registration is a separate create-runner-file step.
      initContainers:
        - name: register
          image: data.forgejo.org/forgejo/runner:11
          workingDir: /data                  # create-runner-file writes ./.runner here
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ ! -f /data/.runner ]; then
                forgejo-runner create-runner-file --connect \
                  --instance "$FORGEJO_URL" \
                  --name "$RUNNER_NAME" \
                  --secret "$RUNNER_SECRET"
              fi
          env:
            - name: FORGEJO_URL
              value: http://forgejo.whatsoever.au/
            - name: RUNNER_NAME
              value: k3s-dind-runner
            # Shared secret pre-established on the Forgejo server with
            # `forgejo forgejo-cli actions register --secret <this>`. Stored in
            # Vault at kv/forgejo/runner under `token`.
            - name: RUNNER_SECRET
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner-creds
                  key: token
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: runner
          image: data.forgejo.org/forgejo/runner:11
          # Wait for the DinD sidecar: the daemon exits if it can't reach docker
          # at startup, so retry until dind is up instead of crash-looping.
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until forgejo-runner daemon --config /config/config.yaml; do
                echo "runner exited (waiting for dind); retrying in 3s..."
                sleep 3
              done
          env:
            - name: DOCKER_HOST               # reach the DinD sidecar (config also sets this)
              value: tcp://localhost:2375
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
        # Docker-in-Docker: the daemon that builds the image. Privileged is
        # required for DinD. Isolated in this namespace; harden later if desired.
        - name: dind
          image: docker:dind
          securityContext:
            privileged: true
          args:
            - "--host=tcp://0.0.0.0:2375"    # non-TLS, pod-local only
            # (removed --insecure-registry: forgejo.whatsoever.au now has a valid
            #  Let's Encrypt cert via cert-manager, so dind validates TLS normally.)
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          volumeMounts:
            - name: dind-storage
              mountPath: /var/lib/docker
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          configMap:
            name: forgejo-runner-config
        - name: dind-storage
          persistentVolumeClaim:
            claimName: forgejo-runner-dind    # dedicated iSCSI volume, off node disk
