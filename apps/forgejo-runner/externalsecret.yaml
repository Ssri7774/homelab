# Persistent runner credentials from Forgejo's "Create new runner" screen
# (this v11 runner uses a UUID + token pair, not a one-time registration token).
# Seed BOTH into Vault (single line, no stray spaces):
#   vault kv put kv/forgejo/runner uuid=<UUID> token=<TOKEN>
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: forgejo-runner-creds
  namespace: forgejo-runner
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: forgejo-runner-creds
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: uuid
      remoteRef:
        key: forgejo/runner
        property: uuid
    - secretKey: token
      remoteRef:
        key: forgejo/runner
        property: token
