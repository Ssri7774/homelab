apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: n8n-vault-secret
  namespace: n8n
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: n8n-vault-auth  # <--- This is the new K8s secret ESO will create
    creationPolicy: Owner
  data:
    - secretKey: N8N_ENCRYPTION_KEY
      remoteRef:
        key: n8n
        property: N8N_ENCRYPTION_KEY