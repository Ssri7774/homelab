# Dedicated CloudNativePG Cluster for Zitadel - SEPARATE from marga-pg so the
# IdP's data lifecycle is independent of the app's. Reuses the CNPG operator
# already installed in B-R1-01 (no new operator).
#
# Credential split (deliberate):
#   - superuser (postgres): CNPG-generated, in Secret "zitadel-pg-superuser".
#     Used ONLY as Zitadel's setup "Admin" to create the zitadel DB + role.
#   - runtime "zitadel" role: created by Zitadel's setup with the password from
#     Vault (Secret "zitadel-db"). That is the DB credential that lives in Vault.
#   We intentionally do NOT pre-create the zitadel DB/role here - Zitadel's Admin
#   bootstraps them, so there's no double-create conflict.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: zitadel-pg
  namespace: zitadel
spec:
  instances: 2                       # HA pair, same posture as marga-pg. Drop to 1
                                     # for a lighter first bootstrap if you prefer.
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4

  primaryUpdateStrategy: unsupervised
  # B-R1-09: hand the primary role to the already-updated replica instead of
  # restarting the primary in place. Measured on marga-pg 4 Oct: the default
  # (restart) held the primary down for minutes during the plugin rollout. For
  # zitadel that is "nobody can log in", so switch over (seconds) instead.
  primaryUpdateMethod: switchover

  # Zitadel's setup Admin needs a privileged login to CREATE DATABASE / CREATE
  # ROLE. Enable the superuser secret for exactly that (setup-time only).
  enableSuperuserAccess: true

  storage:
    # MUST be the ext4 class: the Synology CSI has fsGroupPolicy
    # ReadWriteOnceWithFSType, so fsGroup (26) is only applied to a volume with a
    # recognised fstype. This class formats ext4 -> fsGroup applied -> initdb can
    # write its data dir. (marga-pg's live PVCs use this class; "synology-iscsi-
    # storage" produces a no-fstype volume and initdb fails with Permission denied.)
    storageClass: synology-iscsi-ext4
    size: 8Gi

  # Keep PG off the memory-tight control-plane (hp-master) and spread the pair
  # across the workers - identical rationale to marga-pg (workers carry no role
  # label, so we exclude the control-plane role rather than require a worker one).
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist

  bootstrap:
    initdb:
      database: app                  # neutral bootstrap DB; Zitadel creates its
      owner: app                     # own "zitadel" DB + role via the Admin user.

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  monitoring:
    enablePodMonitor: true

  # B-R1-09: continuous WAL archiving + base backups through the Barman Cloud
  # plugin to ObjectStore zitadel-pg-store (backup.yaml). See marga-pg for the
  # "archived_count rose while archiving to nowhere" finding.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: zitadel-pg-store
