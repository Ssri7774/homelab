# B-R1-02: TLS material for the in-cluster OIDC backchannel hop.
#
# The Zitadel issuer is https://auth.tail56799c.ts.net (Tailscale-terminated for
# browsers). The marga pod is NOT on the tailnet, so a CoreDNS rewrite points that
# host at THIS proxy in-cluster; the proxy must therefore serve TLS for the name.
# This is a self-signed leaf (+CA chain) generated ONCE and stored in Vault, same
# generate-once pattern as the masterkey. Rotating it means re-issuing and updating
# marga's CA trust (zitadel-auth-ca) in lockstep.
#
# Vault path (KV v2, mount "kv"), key marga/authtls:
#   crt = leaf certificate + CA, concatenated (nginx serves the chain)
#   key = leaf private key
#   ca  = CA certificate only (consumed by marga's zitadel-auth-ca ExternalSecret)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zitadel-proxy-tls
  namespace: zitadel
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: zitadel-proxy-tls
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: tls.crt
      remoteRef:
        key: marga/authtls
        property: crt
    - secretKey: tls.key
      remoteRef:
        key: marga/authtls
        property: key
