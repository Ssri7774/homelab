# Zitadel OIDC IdP. Chart pinned to 10.0.4 (Zitadel app v4.15.3) - the latest
# STABLE line as of 8 Aug 2026 (11.0.0 is beta; its appVersion v4.14.0 is older
# than this chart's v4.15.3, so pinning stable costs no app freshness).
#
# ┌─ ISSUER IDENTITY (thread this ONE host everywhere) ────────────────────────┐
# │ ExternalDomain below == the Tailscale MagicDNS host in ingress.yaml         │
# │ (hostname "auth") == the app's OIDC issuer / discovery / JWKS base.         │
# │ Issuer is  https://auth.tail56799c.ts.net  (tailnet tail56799c.ts.net) and   │
# │ is PERMANENT once instance data exists - changing it later invalidates       │
# │ tokens + config. Nothing here or in the app may use a different host.        │
# └─────────────────────────────────────────────────────────────────────────────┘
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
  namespace: zitadel
spec:
  interval: 30m
  releaseName: zitadel
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: zitadel
      version: "10.0.4"                 # pinned deliberately (Zitadel v4.15.3)
      sourceRef:
        kind: HelmRepository
        name: zitadel
        namespace: zitadel          # self-contained (see helmrepository.yaml)
  # dependsOn is not set: zitadel-pg (CNPG) and external-secrets provide the
  # Secrets/CRDs this release needs; the isolated Flux Kustomization retries
  # until zitadel-masterkey / zitadel-config exist.
  values:
    replicaCount: 2

    zitadel:
      # Masterkey from Vault (Secret with key "masterkey"). generate-once.
      masterkeySecretName: zitadel-masterkey

      configmapConfig:
        ExternalDomain: "auth.tail56799c.ts.net"   # <-- issuer host (see banner)
        ExternalPort: 443                            # TLS terminated at the ingress
        ExternalSecure: true                         # we are behind HTTPS
        TLS:
          Enabled: false                             # Zitadel serves plain h2c;
                                                     # Tailscale ingress does TLS.
        Database:
          Postgres:
            Host: zitadel-pg-rw.zitadel.svc.cluster.local   # CNPG primary (rw) svc
            Port: 5432
            Database: zitadel
            User:                                    # runtime role Zitadel uses
              Username: zitadel
              SSL:
                Mode: require                        # CNPG serves TLS in-cluster.
                                                     # Pre-gate: verify-full + CA
                                                     # trust (mirrors B-R1-01 note).
            Admin:                                   # setup-only privileged login
              Username: postgres                     # CNPG superuser
              SSL:
                Mode: require

      # DB passwords must reach the setup/init HOOK JOB, which the chart does NOT
      # give `zitadel.env` to (env is Deployment-only). The chart-blessed path is
      # a config Secret mounted + merged with the ConfigMap for ALL workloads
      # (deployment + init/setup jobs). Built by ExternalSecret zitadel-config
      # from Vault: User.Password = db_password, Admin.Password = admin_password.
      # Nothing sensitive in Git.
      configSecretName: zitadel-config    # key "config-yaml" (chart default)

    # Login v2 is the Zitadel v4 default (the instance redirects to /ui/v2/login,
    # a separate Next.js app). Deploy it; the chart auto-wires its login-client
    # key (SystemAPIUsers.login-client). Our nginx proxy (zitadel-proxy) routes
    # /ui/v2/login -> this login Service (zitadel-login:3000), everything else
    # -> core. Issuer/host unchanged (auth.tail56799c.ts.net).
    login:
      enabled: true

    # No bundled Postgres - we use the dedicated CNPG cluster.
    postgresql:
      enabled: false

    # No chart ingress - we attach our own tailnet-only Tailscale Ingress
    # (ingress.yaml) so exposure matches Marga exactly.
    ingress:
      enabled: false

    service:
      port: 8080                        # h2c; the Ingress backends onto this port
