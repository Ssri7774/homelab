# Zitadel's two Vault-sourced secrets, via the existing vault-backend
# ClusterSecretStore (KV v2, mount "kv"). Same pattern + API version as B-R1-01
# (ESO 0.9.11 -> external-secrets.io/v1beta1; remoteRef.key is mount-relative,
# no "kv/" prefix). NOTHING sensitive is in Git.
#
# Vault path (KV v2, mount "kv"), key marga/zitadel:
#   masterkey    = <32-char random>   # CRITICAL: generate ONCE, never regenerate.
#                                     #   Zitadel encrypts stored secrets with it;
#                                     #   losing/changing it makes existing data
#                                     #   undecryptable. Vault's own backup covers it.
#   db_password  = <random>           # the runtime "zitadel" DB role password
#                                     #   (Zitadel's Admin sets this on the role at
#                                     #   setup; this is the credential in Vault).
#
# Seed it (generate-once - do NOT re-run the masterkey put after go-live):
#   MK=$(head -c 32 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32)
#   DBP=$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)
#   vault kv put kv/marga/zitadel masterkey="$MK" db_password="$DBP"
#
# Before B-R1-GATE: scope vault-backend (or a new store) to a Marga-only Vault
# role so Marga can read only marga/* (least privilege) - same note as B-R1-01.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zitadel-masterkey
  namespace: zitadel
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: zitadel-masterkey
    creationPolicy: Owner
    deletionPolicy: Retain          # never let ESO delete the masterkey secret
  data:
    - secretKey: masterkey          # chart requires the key be exactly "masterkey"
      remoteRef:
        key: marga/zitadel
        property: masterkey
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zitadel-db
  namespace: zitadel
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: zitadel-db
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password           # consumed as the Zitadel runtime User password
      remoteRef:
        key: marga/zitadel
        property: db_password
