# Zitadel DB passwords delivered as a mounted CONFIG secret (key "config-yaml"),
# which the chart merges into Zitadel's config for EVERY workload - crucially the
# setup/init hook job, which does NOT receive `zitadel.env` (deployment-only).
# Templated from Vault so nothing sensitive is in Git.
#
# Vault path (KV v2, mount "kv"), key marga/zitadel:
#   db_password     = <runtime "zitadel" role password>   (already seeded)
#   admin_password  = <the CNPG "postgres" superuser password>   (see note)
#
# NOTE on admin_password: for v1 it must equal the live CNPG superuser password
# (Secret zitadel-pg-superuser). Seed it once:
#   PW=$(kubectl -n zitadel get secret zitadel-pg-superuser -o jsonpath='{.data.password}' | base64 -d)
#   kubectl -n vault exec -i vault-vault-0 -- env NEWPW="$PW" \
#     sh -c 'vault kv patch kv/marga/zitadel admin_password="$NEWPW"'
# Coupling caveat (pre-gate hardening): this pins Vault to a CNPG-generated value.
# The clean version is to have CNPG consume a Vault-provided superuser via
# .spec.superuserSecret so Vault is the single source; do that in hardening. If
# you ever recreate zitadel-pg, re-sync admin_password.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zitadel-config
  namespace: zitadel
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: zitadel-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # Same YAML shape as configmapConfig; merged by Zitadel at startup.
        config-yaml: |
          Database:
            Postgres:
              User:
                Password: "{{ .db_password }}"
              Admin:
                Password: "{{ .admin_password }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: marga/zitadel
        property: db_password
    - secretKey: admin_password
      remoteRef:
        key: marga/zitadel
        property: admin_password
