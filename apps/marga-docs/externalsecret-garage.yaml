# Garage node secret + the docs-store CA keypair, from Vault kv/marga-docs/store.
# Seeded per the D3 bundle's qc/live/10-vault-docs.sh BEFORE this is pushed
# (B-R1-VAULT lesson: the Vault property exists before the ExternalSecret that
# reads it). GENERATE ONCE; later additions use `vault kv patch`, never `kv put`.
#
# NOT under kv/marga/*: namespace marga's SecretStore (marga-policy) can read
# all of kv/marga/*, and the app has no business holding the store's RPC secret
# or the CA's PRIVATE key (review round 1). The app's own half - its S3 key and
# the CA certificate - is kv/marga/docs.
#
# A CA of its own, not marga-backup's: a separate trust root for a separate
# failure domain. Why the CA keypair lives in Vault rather than a cert-manager
# self-signed chain: marga-web (namespace marga) must trust it, and a
# cert-manager Secret cannot cross namespaces; Vault + ESO deliver ca.crt
# to both sides (same pattern as kv/marga/backup and kv/marga/authtls).
#
# Store: the ClusterSecretStore, exactly like marga-backup (B-R1-09). The
# Marga-scoped SecretStore (B-R1-11) exists only in namespace marga; a
# marga-docs-scoped Vault role is a Terraform change, recorded as a residual
# in the D3 hand-off rather than smuggled in here.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: garage-node
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-backend}
  target:
    name: garage-node
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: GARAGE_RPC_SECRET
      remoteRef: {key: marga-docs/store, property: garage_rpc_secret}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: docs-ca
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-backend}
  target:
    name: docs-ca
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef: {key: marga-docs/store, property: ca_crt}
    - secretKey: tls.key
      remoteRef: {key: marga-docs/store, property: ca_key}
