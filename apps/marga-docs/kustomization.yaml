apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: marga-docs
resources:
  - namespace.yaml
  - externalsecret-garage.yaml   # rpc secret + docs CA keypair (Vault kv/marga/docs)
  - tls.yaml                     # CA Issuer + server cert for the TLS sidecar
  - garage.yaml                  # PVC + ConfigMaps + Deployment + Service
  - networkpolicy.yaml           # default-deny; only marga-web -> :8443
