# Tailscale operator OAuth creds, materialised from Vault as the Secret the
# operator reads by default (name: operator-oauth, keys client_id/client_secret).
# Seeded at: kv/tailscale/operator  (mount-relative key, matches vault-backend).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: operator-oauth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client_id
      remoteRef:
        key: tailscale/operator
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: tailscale/operator
        property: client_secret
