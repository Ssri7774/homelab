# API version v1beta3: precheck 28 Nov 2026 - alerts/providers serve v1beta2 + v1beta3
# (storage), no v1 on notification-controller v1.8.4 / flux v2.8.6.
#
# eventSources[].namespace DEFAULTS TO THE ALERT'S NAMESPACE (flux-system), so a
# bare `{kind: HelmRelease, name: '*'}` would silently miss every HelmRelease
# outside flux-system. Each namespace that holds a GitRepository / Kustomization /
# HelmRelease gets its own line - copied from 00-precheck section 6.
# Source kinds (HelmRepository/HelmChart/OCIRepository/Bucket) are included
# because helm-controller emits NO event when a chart source is missing or not
# ready (it only sets Ready=False) - the HelmChart's own error event is the signal.
# A NEW namespace with a HelmRelease needs a line here (README "Keeping it complete").
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: gitops-health
spec:
  providerRef:
    name: slack
  eventSeverity: error            # Ready=False / fetch / build / apply / upgrade failures
  eventSources:
    # Generated by 00-precheck section 6 on 28 Nov 2026 (flux v2.8.6). Re-run + diff when a namespace gains a Flux object.
    - {kind: GitRepository, name: '*', namespace: flux-system}
    - {kind: OCIRepository, name: '*', namespace: flux-system}
    - {kind: Bucket, name: '*', namespace: flux-system}
    - {kind: Kustomization, name: '*', namespace: flux-system}
    - {kind: HelmRepository, name: '*', namespace: authentik}
    - {kind: HelmRepository, name: '*', namespace: cert-manager}
    - {kind: HelmRepository, name: '*', namespace: cnpg-system}
    - {kind: HelmRepository, name: '*', namespace: flux-system}
    - {kind: HelmRepository, name: '*', namespace: milvus-operator}
    - {kind: HelmRepository, name: '*', namespace: monitoring}
    - {kind: HelmRepository, name: '*', namespace: n8n}
    - {kind: HelmRepository, name: '*', namespace: tailscale}
    - {kind: HelmRepository, name: '*', namespace: zitadel}
    - {kind: HelmChart, name: '*', namespace: authentik}
    - {kind: HelmChart, name: '*', namespace: cert-manager}
    - {kind: HelmChart, name: '*', namespace: cnpg-system}
    - {kind: HelmChart, name: '*', namespace: flux-system}
    - {kind: HelmChart, name: '*', namespace: milvus-operator}
    - {kind: HelmChart, name: '*', namespace: monitoring}
    - {kind: HelmChart, name: '*', namespace: n8n}
    - {kind: HelmChart, name: '*', namespace: tailscale}
    - {kind: HelmChart, name: '*', namespace: zitadel}
    - {kind: HelmRelease, name: '*', namespace: authentik}
    - {kind: HelmRelease, name: '*', namespace: cert-manager}
    - {kind: HelmRelease, name: '*', namespace: cnpg-system}
    - {kind: HelmRelease, name: '*', namespace: flux-system}
    - {kind: HelmRelease, name: '*', namespace: milvus-operator}
    - {kind: HelmRelease, name: '*', namespace: monitoring}
    - {kind: HelmRelease, name: '*', namespace: n8n}
    - {kind: HelmRelease, name: '*', namespace: tailscale}
    - {kind: HelmRelease, name: '*', namespace: zitadel}
  eventMetadata:
    summary: "Marga homelab GitOps - reconcile FAILING"
    cluster: homelab-k3s
---
# The "resolved" half for the incident class this ticket is about (a frozen
# source). source-controller emits an info event on a NEW artifact and on
# RECOVERY from failure ("stored artifact for commit ..."); the inclusionList
# keeps GitRepository errors from double-posting via this Alert.
# Side effect, accepted: one Slack line per push to Forgejo (a deploy receipt).
# Kustomization/HelmRelease info events are deliberately NOT forwarded (drift
# corrections + every apply would be noise); their recovery = errors stop.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: gitops-source-recovered
spec:
  providerRef:
    name: slack
  eventSeverity: info
  inclusionList:
    - ".*stored artifact.*"
  eventSources:
    - {kind: GitRepository, name: '*', namespace: flux-system}   # the only GitRepository (precheck 28 Nov)
  eventMetadata:
    summary: "Marga homelab GitOps - source OK"
    cluster: homelab-k3s
