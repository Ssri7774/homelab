# Slack incoming-webhook URL for Flux notification-controller.
# Seeded per ops/01-vault-seed.md BEFORE this is pushed.
# vault-backend excludes only ns `marga` (B-R1-11), so flux-system may use it;
# eso-policy grants kv/data/*. Same shape as marga-backup/externalsecret-garage.yaml.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flux-slack-webhook
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-backend}
  target:
    name: flux-slack-webhook
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: address          # Provider reads the webhook URL from key `address`
      remoteRef: {key: slack/flux-webhook, property: address}
