apiVersion: apps/v1
kind: Deployment
metadata:
  name: marga-web
  namespace: marga
  labels:
    app.kubernetes.io/name: marga-web
    app.kubernetes.io/part-of: marga
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: marga-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marga-web
        app.kubernetes.io/part-of: marga
    spec:
      # These pods never call the K8s API - don't hand them a token.
      automountServiceAccountToken: false
      # B-R1-15: never schedule onto the control-plane node (hp-master). Its
      # kubelet cannot resolve the internal registry (`lookup
      # forgejo.whatsoever.au: no such host`, B-R1-11), so any marga-web pod
      # placed there, including a rollout's surge pod, sits in
      # Init:ImagePullBackOff, which is why rollouts needed `kubectl cordon
      # hp-master`. It is also the wifi-linked, memory-tight node. Same rule as
      # marga-pg (postgres-cluster.yaml): the workers carry no worker label,
      # so exclude the control-plane role rather than require a label that
      # does not exist. REQUIRED, not preferred: with "preferred" the
      # scheduler may still pick hp-master when the workers are tight, which
      # is exactly the case a rollout surge creates.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        # B-R2-DOCS D3: the Secret volumes below are mode 0440 and group-owned
        # by this gid, so only the app user can read the keys.
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # Next.js standalone writes its FileSystemCache under .next/cache, and
        # libraries may use /tmp. readOnlyRootFilesystem is kept true; these
        # emptyDir mounts give the only writable paths the app needs.
        #
        # B-R2-DOCS D3 - THE PLAINTEXT-IN-MEMORY GUARD. Both are now
        # medium: Memory (tmpfs). The web container has NO writable disk path
        # left: the root is read-only and these are RAM. request.formData()
        # keeps an upload as an in-memory Blob (measured: zero file opens for
        # writing across a 25 MiB upload), and if any parser ever tried to
        # spill a passport to /tmp it would land in RAM, not on the node's
        # disk. document-store-verify fails if either mount stops being tmpfs.
        # tmpfs counts against the container's memory limit (raised below).
        - name: next-cache
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
        # --- B-R2-DOCS D3: secrets as FILES on memory-backed volumes -------
        # Never env: a container's env is part of its spec, which containerd
        # persists on the node's disk (B-R2-KEK-ATREST). Explicit `items`, so a
        # Secret missing a key fails the pod at mount time, loudly.
        - name: doc-kek                     # the document KEKs, web ONLY
          secret:
            secretName: marga-doc-kek
            defaultMode: 0440
            items:
              - {key: DOC_KEK_V1, path: DOC_KEK_V1}   # unwrap only
              - {key: DOC_KEK_V2, path: DOC_KEK_V2}   # ACTIVE (marga-config)
        - name: field-key                   # pgcrypto field key, web + migrate
          secret:
            secretName: marga-field-key
            defaultMode: 0440
            items:
              - {key: FIELD_KEY, path: FIELD_KEY}
        - name: docs-s3                     # marga-docs store key + CA, web ONLY
          secret:
            secretName: marga-docs-s3
            # optional: the STORE is not a dependency of the CRM (DESIGN 2).
            # Without this Secret the pod still starts and serves; uploads
            # fail closed ("could not be stored safely") until it exists.
            # (doc-kek and field-key stay mandatory: readiness needs them.)
            optional: true
            defaultMode: 0440
            items:
              - {key: ACCESS_KEY_ID, path: ACCESS_KEY_ID}
              - {key: SECRET_ACCESS_KEY, path: SECRET_ACCESS_KEY}
              - {key: ca.crt, path: ca.crt}
        - name: auth-ca
          secret:
            secretName: zitadel-auth-ca
        # B-R1-11 piece 3: the CNPG cluster CA, so the DB connections can run
        # sslmode=verify-full. marga-pg-ca is generated by CloudNativePG and
        # ALSO contains ca.key (which signs the server certificate AND the
        # streaming_replica client certificate). `items` projects ca.crt only;
        # the key never lands in the pod. Not subPath, so kubelet refreshes the
        # file when CNPG renews the CA. This commit only MOUNTS it; nothing
        # reads it until the next two commits, which is what lets either of
        # them be reverted alone without leaving a dangling sslrootcert path.
        - name: pg-ca
          secret:
            secretName: marga-pg-ca
            items:
              - key: ca.crt
                path: ca.crt
      # Run DB migrations before the app starts. Uses the SAME image, so the
      # migration history ships with the code. Idempotent (safe on every start).
      initContainers:
        - name: migrate
          image: __IMAGE__   # e.g. forgejo.whatsoever.au/marga/marga-web:<git-sha>
          command: ["node", "scripts/migrate.mjs"]
          # B-R2-DOCS D3: when this init container fails, its last log lines
          # become the termination message, so `kubectl describe pod` shows WHY
          # (the recurring Init:Error could never be captured before). Its log
          # carries no secret: migrate.mjs logs migration file names, connect
          # error codes, and on failure the PostgreSQL error message (which can
          # name a role or an object, never a password or key).
          terminationMessagePolicy: FallbackToLogsOnError
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: marga-pg-app       # generated by CloudNativePG
                  key: uri
            # --- B-R1-08: the migration needs the field key -------------------
            # THIS IS THE ONE THAT GETS MISSED. Migration 0008 rewrites
            # case_file.visa_type and client.mobile into ciphertext, so the
            # MIGRATION encrypts, not just the app. scripts/migrate.mjs passes
            # this to set_config('app.field_key', $1, true) as a bind parameter
            # and 0008 reads it back with current_setting(), so the key never
            # appears in any statement text and never reaches the server log.
            #
            # Without it the initContainer fails closed and loudly:
            #   "app.field_key is not set, so 0008 cannot encrypt anything"
            # 0008 runs in a transaction, so that failure leaves
            # schema_migrations at 0007 and both columns still text. The right
            # failure, but a crash-looping pod on deploy day rather than a
            # manifest somebody reviewed.
            #
            # This widens who holds the key by one container, and it is worth
            # stating rather than slipping past: this initContainer already
            # holds the table OWNER credential (marga-pg-app), so it was
            # already the most privileged thing in this Deployment. Adding the
            # field key does not change which pod is the crown jewel, but a
            # compromise of the init path now yields both the owner credential
            # and the ability to decrypt. Nothing cheaper exists - migrations
            # cannot encrypt without the key, and splitting 0008 into a
            # privileged Job adds a moving part that must run exactly once,
            # which is the problem schema_migrations already solves.
            #
            # B-R2-DOCS D3: now a FILE on the field-key Secret volume, not env
            # (env is kept on the node's disk). scripts/field-key.mjs reads
            # FIELD_KEY_FILE first - migrate.mjs has used it since B-R1-08.
            - name: FIELD_KEY_FILE
              value: /etc/marga/field-key/FIELD_KEY
            # --- B-R1-11 piece 3b: TLS + verification for the OWNER connection --
            # marga-pg-app's `uri` is generated by CloudNativePG with NO sslmode,
            # and node-pg then connects in PLAINTEXT: this initContainer has been
            # sending the table-owner password and every migration (including
            # 0008's ciphertext rewrite) unencrypted across the Flannel overlay.
            # That URI is operator-owned, so it cannot be templated like
            # marga-app-role. node-pg falls back to PGSSLMODE when the URI has no
            # ssl parameters: verify-full -> ssl=true with Node's default
            # verification (rejectUnauthorized, hostname check). NODE_EXTRA_CA_CERTS
            # adds the CNPG CA to the trust store for this process only. Fails
            # CLOSED: a wrong or missing CA crash-loops the NEW pod's init, and
            # the rolling update keeps the old pods serving.
            - name: PGSSLMODE
              value: verify-full
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/ssl/pgca/ca.crt
          volumeMounts:
            - name: pg-ca
              mountPath: /etc/ssl/pgca
              readOnly: true
            - name: field-key              # B-R2-DOCS D3: FIELD_KEY_FILE
              mountPath: /etc/marga/field-key
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: web
          image: __IMAGE__   # bumped by a reviewed commit (founder gate); never :latest
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: marga-config
          env:
            # --- B-R1-03: the running app connects as marga_app ---------------
            # Was: marga-pg-app (the table owner). A table owner is exempt from
            # its own RLS policies unless FORCE is set, and even with FORCE it
            # can DROP the policies outright. marga_app owns nothing, has no
            # BYPASSRLS, no role memberships, and holds DML only on tables that
            # migration 0003 has put under a tenant policy. This one reference is
            # what makes RLS real. The migrate initContainer above KEEPS the
            # owner credential, because DDL needs it.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: marga-app-role
                  key: uri
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: marga-minio
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: marga-minio
                  key: MINIO_SECRET_KEY
            # --- B-R1-02 auth: OIDC client creds + session key from Vault ---
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: marga-oidc
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: marga-oidc
                  key: OIDC_CLIENT_SECRET
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: marga-oidc
                  key: SESSION_SECRET
            # Trust the in-cluster TLS hop to the issuer host (self-signed CA from
            # Vault via ESO). The OIDC issuer stays https://auth.tail56799c.ts.net;
            # split-horizon DNS points the pod at zitadel-proxy, which serves this CA.
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/ssl/authca/ca.crt
            # --- B-R1-08: the pgcrypto field key ------------------------------
            # lib/field-crypto.ts reads this lazily, enforces a 32-character
            # floor, and passes it as a bind parameter ($n::text) on every
            # statement touching case_file.visa_type or client.mobile. It is
            # never interpolated into SQL and never logged - the CNPG Cluster
            # sets log_parameter_max_length: "0" so bind parameters cannot
            # reach the server log by any path.
            # B-R2-DOCS D3: it is no longer env. FIELD_KEY_FILE (marga-config)
            # points at the field-key Secret volume mounted below.
            # The document KEKs and the docs-store credentials are the same:
            # files only (DOC_KEK_DIR, DOCS_S3_DIR in marga-config).
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
            - name: auth-ca
              mountPath: /etc/ssl/authca
              readOnly: true
            - name: pg-ca                  # B-R1-11: sslrootcert in DATABASE_URL
              mountPath: /etc/ssl/pgca
              readOnly: true
            - name: doc-kek                # B-R2-DOCS D3: DOC_KEK_DIR
              mountPath: /etc/marga/doc-kek
              readOnly: true
            - name: field-key              # B-R2-DOCS D3: FIELD_KEY_FILE
              mountPath: /etc/marga/field-key
              readOnly: true
            - name: docs-s3                # B-R2-DOCS D3: DOCS_S3_DIR
              mountPath: /etc/marga/docs-s3
              readOnly: true
          # Readiness IS dependency-aware: pull the pod out of the Service when
          # Postgres/MinIO are unreachable, but don't kill it.
          # B-R2-DOCS D3: it also loads the document keyring and the field key
          # from their volumes, so a pod missing doc-kek-v2 (or with a KEK in
          # env) never becomes ready and the rollout stalls on it while the old
          # pods keep serving. The document STORE is not checked (DESIGN 2).
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # Liveness is dependency-free: only restart if the process itself hangs.
          livenessProbe:
            httpGet:
              path: /api/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          # B-R2-DOCS D3: an upload is held in memory while it is parsed (the
          # formData Blob) and then streamed once through the envelope to the
          # store. Measured on the develop rig in a 512Mi memory cgroup holding
          # the image-shaped server AND the in-pod upload QC together: peak
          # 195 MiB for one QC run, 230 MiB over four back-to-back runs (each
          # with a 25 MiB upload and a refused 25 MiB + 1 byte one), 0 OOM.
          # One upload per pod at a time (DOCS_UPLOAD_CONCURRENCY). The two
          # 64Mi tmpfs mounts count against this limit too.
          # B-R2-DOCS D4: a download streams (at most one 64 KiB chunk held per
          # stage); the same rig run with D4's QC added (upload QC + download
          # QC with four concurrent 25 MiB downloads + tamper + both
          # verifiers) peaked at 223 MiB in this 512Mi limit, 0 OOM.
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
