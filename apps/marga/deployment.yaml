apiVersion: apps/v1
kind: Deployment
metadata:
  name: marga-web
  namespace: marga
  labels:
    app.kubernetes.io/name: marga-web
    app.kubernetes.io/part-of: marga
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: marga-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marga-web
        app.kubernetes.io/part-of: marga
    spec:
      # These pods never call the K8s API - don't hand them a token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # Next.js standalone writes its FileSystemCache under .next/cache, and
        # libraries may use /tmp. readOnlyRootFilesystem is kept true; these
        # emptyDir mounts give the only writable paths the app needs.
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      # Run DB migrations before the app starts. Uses the SAME image, so the
      # migration history ships with the code. Idempotent (safe on every start).
      initContainers:
        - name: migrate
          image: __IMAGE__   # e.g. forgejo.whatsoever.au/marga/marga-web:<git-sha>
          command: ["node", "scripts/migrate.mjs"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: marga-pg-app       # generated by CloudNativePG
                  key: uri
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: web
          image: __IMAGE__   # bumped by a reviewed commit (founder gate); never :latest
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: marga-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: marga-pg-app
                  key: uri
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: marga-minio
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: marga-minio
                  key: MINIO_SECRET_KEY
            # --- B-R1-02 auth: OIDC client creds + session key from Vault ---
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: marga-oidc
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: marga-oidc
                  key: OIDC_CLIENT_SECRET
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: marga-oidc
                  key: SESSION_SECRET
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
          # Readiness IS dependency-aware: pull the pod out of the Service when
          # Postgres/MinIO are unreachable, but don't kill it.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # Liveness is dependency-free: only restart if the process itself hangs.
          livenessProbe:
            httpGet:
              path: /api/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
