apiVersion: apps/v1
kind: Deployment
metadata:
  name: marga-web
  namespace: marga
  labels:
    app.kubernetes.io/name: marga-web
    app.kubernetes.io/part-of: marga
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: marga-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marga-web
        app.kubernetes.io/part-of: marga
    spec:
      # These pods never call the K8s API - don't hand them a token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # Next.js standalone writes its FileSystemCache under .next/cache, and
        # libraries may use /tmp. readOnlyRootFilesystem is kept true; these
        # emptyDir mounts give the only writable paths the app needs.
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: auth-ca
          secret:
            secretName: zitadel-auth-ca
        # B-R1-11 piece 3: the CNPG cluster CA, so the DB connections can run
        # sslmode=verify-full. marga-pg-ca is generated by CloudNativePG and
        # ALSO contains ca.key (which signs the server certificate AND the
        # streaming_replica client certificate). `items` projects ca.crt only;
        # the key never lands in the pod. Not subPath, so kubelet refreshes the
        # file when CNPG renews the CA. This commit only MOUNTS it; nothing
        # reads it until the next two commits, which is what lets either of
        # them be reverted alone without leaving a dangling sslrootcert path.
        - name: pg-ca
          secret:
            secretName: marga-pg-ca
            items:
              - key: ca.crt
                path: ca.crt
      # Run DB migrations before the app starts. Uses the SAME image, so the
      # migration history ships with the code. Idempotent (safe on every start).
      initContainers:
        - name: migrate
          image: __IMAGE__   # e.g. forgejo.whatsoever.au/marga/marga-web:<git-sha>
          command: ["node", "scripts/migrate.mjs"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: marga-pg-app       # generated by CloudNativePG
                  key: uri
            # --- B-R1-08: the migration needs the field key -------------------
            # THIS IS THE ONE THAT GETS MISSED. Migration 0008 rewrites
            # case_file.visa_type and client.mobile into ciphertext, so the
            # MIGRATION encrypts, not just the app. scripts/migrate.mjs passes
            # this to set_config('app.field_key', $1, true) as a bind parameter
            # and 0008 reads it back with current_setting(), so the key never
            # appears in any statement text and never reaches the server log.
            #
            # Without it the initContainer fails closed and loudly:
            #   "app.field_key is not set, so 0008 cannot encrypt anything"
            # 0008 runs in a transaction, so that failure leaves
            # schema_migrations at 0007 and both columns still text. The right
            # failure, but a crash-looping pod on deploy day rather than a
            # manifest somebody reviewed.
            #
            # This widens who holds the key by one container, and it is worth
            # stating rather than slipping past: this initContainer already
            # holds the table OWNER credential (marga-pg-app), so it was
            # already the most privileged thing in this Deployment. Adding the
            # field key does not change which pod is the crown jewel, but a
            # compromise of the init path now yields both the owner credential
            # and the ability to decrypt. Nothing cheaper exists - migrations
            # cannot encrypt without the key, and splitting 0008 into a
            # privileged Job adds a moving part that must run exactly once,
            # which is the problem schema_migrations already solves.
            - name: FIELD_KEY
              valueFrom:
                secretKeyRef:
                  name: marga-field-key
                  key: FIELD_KEY
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: web
          image: __IMAGE__   # bumped by a reviewed commit (founder gate); never :latest
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: marga-config
          env:
            # --- B-R1-03: the running app connects as marga_app ---------------
            # Was: marga-pg-app (the table owner). A table owner is exempt from
            # its own RLS policies unless FORCE is set, and even with FORCE it
            # can DROP the policies outright. marga_app owns nothing, has no
            # BYPASSRLS, no role memberships, and holds DML only on tables that
            # migration 0003 has put under a tenant policy. This one reference is
            # what makes RLS real. The migrate initContainer above KEEPS the
            # owner credential, because DDL needs it.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: marga-app-role
                  key: uri
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: marga-minio
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: marga-minio
                  key: MINIO_SECRET_KEY
            # --- B-R1-02 auth: OIDC client creds + session key from Vault ---
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: marga-oidc
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: marga-oidc
                  key: OIDC_CLIENT_SECRET
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: marga-oidc
                  key: SESSION_SECRET
            # Trust the in-cluster TLS hop to the issuer host (self-signed CA from
            # Vault via ESO). The OIDC issuer stays https://auth.tail56799c.ts.net;
            # split-horizon DNS points the pod at zitadel-proxy, which serves this CA.
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/ssl/authca/ca.crt
            # --- B-R1-08: the pgcrypto field key ------------------------------
            # lib/field-crypto.ts reads this lazily, enforces a 32-character
            # floor, and passes it as a bind parameter ($n::text) on every
            # statement touching case_file.visa_type or client.mobile. It is
            # never interpolated into SQL and never logged - the CNPG Cluster
            # sets log_parameter_max_length: "0" so bind parameters cannot
            # reach the server log by any path.
            - name: FIELD_KEY
              valueFrom:
                secretKeyRef:
                  name: marga-field-key
                  key: FIELD_KEY
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
            - name: auth-ca
              mountPath: /etc/ssl/authca
              readOnly: true
            - name: pg-ca                  # B-R1-11: sslrootcert in DATABASE_URL
              mountPath: /etc/ssl/pgca
              readOnly: true
          # Readiness IS dependency-aware: pull the pod out of the Service when
          # Postgres/MinIO are unreachable, but don't kill it.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # Liveness is dependency-free: only restart if the process itself hangs.
          livenessProbe:
            httpGet:
              path: /api/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
