# Non-secret config (12-factor). Secrets come from Vault via ExternalSecret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: marga-config
  namespace: marga
data:
  # MinIO = the Milvus-bundled "homelab-minio" in the milvus-operator namespace
  # (the only MinIO in the cluster; confirmed via kubectl get svc). Reachability
  # is checked credential-free via /minio/health/live. NOTE (R2 / gate): this
  # instance is owned by the Milvus stack - move Marga's document storage to a
  # dedicated MinIO/tenant before real PII lands.
  MINIO_ENDPOINT: "http://homelab-minio.milvus-operator.svc.cluster.local:9000"
  MINIO_BUCKET: "marga"          # created by the ticket that first needs it
  NODE_ENV: "production"
  PORT: "3000"

  # --- B-R1-02 auth (non-secret) ---
  # Issuer is the ONE Zitadel host; discovery derives authorize/token/jwks/
  # end_session from it. Must equal Zitadel ExternalDomain (apps/zitadel).
  OIDC_ISSUER: "https://auth.tail56799c.ts.net"
  # This app's own base URL; the OIDC redirect/callback + post-logout derive
  # from it (callback = APP_BASE_URL/api/auth/callback, registered on the client).
  APP_BASE_URL: "https://marga.tail56799c.ts.net"
  # Idle timeout in minutes (006: 30-60). Enforced app-side in middleware.
  IDLE_TIMEOUT_MIN: "45"

  # --- B-R2 documents (non-secret) ---
  # The KEK id new documents are wrapped under (lib/doc-crypto.ts
  # loadKeyring/wrapDek). doc-kek-v2 since B-R2-KEK-ATREST; v1 stays loadable
  # for unwrap only. D3 mounts DOC_KEK_V1/V2 from marga-doc-kek as files
  # (DOC_KEK_DIR) and readiness refuses a pod whose volume lacks this id. Rotating = add v<n+1> to Vault +
  # the ExternalSecret, then change THIS value; never reuse or remove an id.
  DOC_KEK_ACTIVE: "doc-kek-v2"

  # --- B-R2-DOCS D3: where the secrets are MOUNTED (paths, not secrets) ---
  # Every key below is a file on a memory-backed Secret volume, never env
  # (container env is kept in the spec containerd persists on the node's
  # disk; B-R2-KEK-ATREST). The app refuses DOC_KEK_V* / DOCS_S3 secrets in
  # env outright, and document-store-verify fails if any slips back.
  DOC_KEK_DIR: "/etc/marga/doc-kek"               # DOC_KEK_V1, DOC_KEK_V2
  FIELD_KEY_FILE: "/etc/marga/field-key/FIELD_KEY"
  DOCS_S3_DIR: "/etc/marga/docs-s3"               # ACCESS_KEY_ID, SECRET_ACCESS_KEY, ca.crt

  # --- B-R2-DOCS D3: the document store (apps/marga-docs) ---
  DOCS_S3_ENDPOINT: "https://garage.marga-docs.svc"
  DOCS_S3_BUCKET: "marga-documents"
  DOCS_S3_REGION: "us-east-1"                     # = Garage s3_region
  # The AWS SDK never reads a shared config/credentials file or IMDS: the
  # client is configured explicitly in lib/doc-store.ts. Belt and braces.
  AWS_CONFIG_FILE: "/dev/null"
  AWS_SHARED_CREDENTIALS_FILE: "/dev/null"
  AWS_EC2_METADATA_DISABLED: "true"

  # Which practices may UPLOAD (lib/doc-upload-policy.ts): comma list of
  # practice ids, "*" for all, empty for none. Opened to the real practice
  # (007e5b9c-...) at the handover, 25 Nov 2026 (d600ba4).
  # B-R2-UI-signout-allpages: the QC dummy Practice B (00000000-...-0000000000b0,
  # fixed id) is listed again so live QC can upload into the DUMMY tenant and
  # never into the real one. B exists only during a QC run (50 seeds it, 70
  # removes it), so between runs this entry names a practice that does not
  # exist. Removing it again is a one-line change + rollout restart.
  DOCS_UPLOAD_PRACTICES: "007e5b9c-ccbb-4b4f-84e0-2e6c8473ccc0,00000000-0000-4000-8000-0000000000b0"

  # B-R2-UI-signout-allpages: PDF / JPEG / PNG open INLINE in a tab (no
  # decrypted copy in Downloads). Chrome renders an inline PDF in its own
  # wrapper ON THE APP ORIGIN (images get a sandboxed null origin), an accepted
  # risk. Uncomment to serve PDFs as attachment-only again, with no new image
  # (images stay inline). Plain ConfigMap: needs
  # `kubectl -n marga rollout restart deploy/marga-web` after Flux applies.
  # DOCS_INLINE_PDF: "off"
  # Uploads are buffered in memory (the envelope needs the length first): one
  # at a time per pod keeps the worst case inside the memory limit below.
  DOCS_UPLOAD_CONCURRENCY: "1"

  # B-R2-DOCS D4: downloads STREAM (nothing buffers a document; measured on the
  # develop rig: +7 MiB in the pod's cgroup across four concurrent 25 MiB
  # downloads). Each live download holds one docs-store connection (the
  # client's pool is 8, shared with upload), so at most this many per pod at
  # once, and at most DOCS_DOWNLOAD_PER_USER per signed-in user so one person
  # cannot hold them all; beyond either, 503 + Retry-After. Capped at 6 in code.
  DOCS_DOWNLOAD_CONCURRENCY: "4"
  DOCS_DOWNLOAD_PER_USER: "2"
  # A download whose reader pulls nothing for DOCS_DOWNLOAD_IDLE_MS is cut (the
  # connection is destroyed, never ended), so a stalled or vanished client
  # cannot hold a slot, a key copy and a store connection. Any download is cut
  # at DOCS_DOWNLOAD_DEADLINE_MS however it is progressing (30 min = 25 MiB at
  # about 120 kbit/s).
  DOCS_DOWNLOAD_IDLE_MS: "60000"
  DOCS_DOWNLOAD_DEADLINE_MS: "1800000"
