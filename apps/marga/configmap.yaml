# Non-secret config (12-factor). Secrets come from Vault via ExternalSecret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: marga-config
  namespace: marga
data:
  # MinIO = the Milvus-bundled "homelab-minio" in the milvus-operator namespace
  # (the only MinIO in the cluster; confirmed via kubectl get svc). Reachability
  # is checked credential-free via /minio/health/live. NOTE (R2 / gate): this
  # instance is owned by the Milvus stack - move Marga's document storage to a
  # dedicated MinIO/tenant before real PII lands.
  MINIO_ENDPOINT: "http://homelab-minio.milvus-operator.svc.cluster.local:9000"
  MINIO_BUCKET: "marga"          # created by the ticket that first needs it
  NODE_ENV: "production"
  PORT: "3000"

  # --- B-R1-02 auth (non-secret) ---
  # Issuer is the ONE Zitadel host; discovery derives authorize/token/jwks/
  # end_session from it. Must equal Zitadel ExternalDomain (apps/zitadel).
  OIDC_ISSUER: "https://auth.tail56799c.ts.net"
  # This app's own base URL; the OIDC redirect/callback + post-logout derive
  # from it (callback = APP_BASE_URL/api/auth/callback, registered on the client).
  APP_BASE_URL: "https://marga.tail56799c.ts.net"
  # Idle timeout in minutes (006: 30-60). Enforced app-side in middleware.
  IDLE_TIMEOUT_MIN: "45"
