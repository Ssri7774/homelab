# B-R2-DOCS D1: the document key-encryption key (KEK).
# B-R2-KEK-ATREST (14 Nov 2026): rotated to doc-kek-v2 BEFORE the first document.
#
# Wraps every document's per-document data key (lib/doc-crypto.ts wrapDek).
# A SEPARATE key from FIELD_KEY (kv/marga/pgcrypto): different purpose,
# different rotation, and a leak of one is not a leak of both.
#
# Vault path (KV v2, mount "kv"), key marga/doc-kek, one FIELD per KEK version:
#   v1 = 64 hex characters (32 random bytes), created 27 Oct 2026 (D1)
#   v2 = 64 hex characters (32 random bytes), created 14 Nov 2026, ACTIVE
# (Field v2 is not "KV version 2": adding it created KV version 2 of the
# secret, which holds BOTH fields. Never `kv rollback` this path.)
# Covered by the existing marga-policy (kv/data/marga/*); no Terraform change.
#
# ---------------------------------------------------------------------------
# WHY v2 EXISTS BEFORE ANY DOCUMENT
# ---------------------------------------------------------------------------
# v1 was synced into the k3s datastore (sqlite state.db on hp-master) while
# k3s Secret encryption was OFF, so v1's bytes sat in plaintext on that disk
# and may survive in sqlite free pages / old revisions / the WAL after the
# reencrypt. v2 was generated in Vault only AFTER `k3s secrets-encrypt` was
# Enabled + reencrypt_finished, so it has only ever been written to the
# datastore encrypted. Nothing is wrapped under v1 (0 documents at rotation):
# it is kept loadable only because removing a KEK id is never safe in general
# (lib/doc-crypto.ts keeps every loaded id usable for unwrap).
#
# ---------------------------------------------------------------------------
# GENERATED INSIDE THE VAULT POD. NEVER RE-PUT v1 OR v2.
# ---------------------------------------------------------------------------
# Each field is generated in the Vault pod and written with `<field>=-` from
# stdin: it never crosses the network, argv or a shell history. Re-putting an
# existing field makes every document wrapped under it permanently unreadable
# - the Zitadel masterkey rule. A rotation ADDS v<n+1> (`vault kv patch`, which
# keeps the other fields) and flips DOC_KEK_ACTIVE in marga-config; it never
# replaces a field. The Vault barrier tarball is re-taken, restore-tested and
# re-uploaded (DEV-002 s9) after every new field: a tarball predating a key
# does not contain it.
#
# ---------------------------------------------------------------------------
# WHO MOUNTS IT
# ---------------------------------------------------------------------------
# Still NO pod mounts it: the running app has no use for the KEK until D3
# (upload) and D4 (download), and a key a process does not hold cannot leak
# from it. D3 gives the web container only (never the migrate initContainer)
# BOTH versions, DOC_KEK_V1 and DOC_KEK_V2, and DOC_KEK_ACTIVE ("doc-kek-v2")
# is already in marga-config (configmap.yaml).
# D3 NOTES (B-R2-KEK-ATREST review):
#   * keyring() loads lazily, on the first document operation, and throws if
#     the active id is not loaded. A D3 that mounts only V1 therefore starts
#     fine and fails its first upload closed (never wraps under v1). Load the
#     keyring at startup or in readiness so the misconfiguration shows at
#     rollout instead.
#   * Prefer a Secret VOLUME (memory-backed) over env/secretKeyRef: env values
#     are written into the container spec, which containerd keeps on the
#     node's disk. loadKeyring() takes an env-shaped object, so reading the
#     files into one is a small D3 change.
#
# The whole scheme reduces to this Secret's confidentiality. Since
# B-R2-KEK-ATREST it sits in the k3s datastore encrypted (AES-CBC, k3s-managed
# key in /var/lib/rancher/k3s/server/cred/ on hp-master).
#
# deletionPolicy: Retain for the same reason as marga-field-key: a sealed Vault
# must not take the key away from a running app.
apiVersion: external-secrets.io/v1beta1   # matches ESO 0.9.11
kind: ExternalSecret
metadata:
  name: marga-doc-kek
  namespace: marga
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore        # B-R1-11: the Marga-scoped store, kv/marga/* only
    name: vault-marga
  target:
    name: marga-doc-kek
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DOC_KEK_V1
      remoteRef:
        key: marga/doc-kek           # mount-relative (store path=kv, v2)
        property: v1
    - secretKey: DOC_KEK_V2          # B-R2-KEK-ATREST: the ACTIVE KEK
      remoteRef:
        key: marga/doc-kek
        property: v2
