# B-R2-DOCS D1: the document key-encryption key (KEK).
#
# Wraps every document's per-document data key (lib/doc-crypto.ts wrapDek).
# A SEPARATE key from FIELD_KEY (kv/marga/pgcrypto): different purpose,
# different rotation, and a leak of one is not a leak of both.
#
# Vault path (KV v2, mount "kv"), key marga/doc-kek:
#   v1 = 64 hex characters (32 random bytes)
# Covered by the existing marga-policy (kv/data/marga/*); no Terraform change.
#
# ---------------------------------------------------------------------------
# GENERATED ONCE, INSIDE THE VAULT POD. NEVER RE-PUT v1.
# ---------------------------------------------------------------------------
# qc/live/10-vault-doc-kek.sh in the B-R2-DOCS-D1 bundle does it, the same way
# kv/marga/pgcrypto was made: the value is generated in the Vault pod, put with
# `v1=-` from stdin, and never crosses the network, argv or a shell history.
# Re-putting v1 makes every document permanently unreadable - the Zitadel
# masterkey rule. Rotation ADDS v2 and flips DOC_KEK_ACTIVE; v1 stays.
#
# The Vault barrier tarball is taken IMMEDIATELY after the key exists and
# BEFORE the first document (Decision K: ~/VaultBackups-local + the encrypted
# USB, never Drive). A tarball from before this key does not contain it.
#
# ---------------------------------------------------------------------------
# WHAT D1 DOES AND DOES NOT DO WITH IT
# ---------------------------------------------------------------------------
# D1 syncs the Secret so ESO delivery and the at-rest checkpoint can be proven.
# NO pod mounts it yet: the running app has no use for the KEK until D3 (upload)
# and D4 (download), and a key a process does not hold cannot leak from it.
# D3 adds, to the web container only (never the migrate initContainer):
#   - name: DOC_KEK_V1
#     valueFrom: { secretKeyRef: { name: marga-doc-kek, key: DOC_KEK_V1 } }
# and DOC_KEK_ACTIVE: "doc-kek-v1" to marga-config.
#
# The whole scheme reduces to this Secret's confidentiality. It sits in the k3s
# datastore like FIELD_KEY; whether k3s encrypts Secrets at rest is the D1
# checkpoint (qc/live/00-pre-deploy.sh, `k3s secrets-encrypt status`).
#
# deletionPolicy: Retain for the same reason as marga-field-key: a sealed Vault
# must not take the key away from a running app.
apiVersion: external-secrets.io/v1beta1   # matches ESO 0.9.11
kind: ExternalSecret
metadata:
  name: marga-doc-kek
  namespace: marga
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore        # B-R1-11: the Marga-scoped store, kv/marga/* only
    name: vault-marga
  target:
    name: marga-doc-kek
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DOC_KEK_V1
      remoteRef:
        key: marga/doc-kek           # mount-relative (store path=kv, v2)
        property: v1
