# MinIO credentials pulled from Vault via the existing vault-backend
# ClusterSecretStore. Wired now so the secret path is proven end to end, even
# though bucket ops are deferred. No credentials in Git.
#
# Vault (KV v2, mount "kv"), path marga/minio:
#   access_key = <minio access key for marga>
#   secret_key = <minio secret key for marga>
# Seed it:  vault kv put kv/marga/minio access_key=... secret_key=...
#
# CONFIRMED 3 Aug 2026: vault-backend has provider.vault.path: kv, version: v2.
# The store prepends the mount + /data/, so remoteRef.key stays mount-relative
# ("marga/minio", as below) - no "kv" or "secret" prefix. Correct as written.
#
# Before B-R1-GATE: tighten to a Marga-scoped Vault role so Marga can read only
# marga/* (least privilege).
apiVersion: external-secrets.io/v1beta1   # matches your ESO 0.9.11 (n8n uses v1beta1)
kind: ExternalSecret
metadata:
  name: marga-minio
  namespace: marga
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: marga-minio
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: MINIO_ACCESS_KEY
      remoteRef:
        key: marga/minio          # mount-relative (store path=kv, v2)
        property: access_key
    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: marga/minio
        property: secret_key
