# B-R1-03 NEW: the password for `marga_app`, the non-owning role the app
# connects as. Kept in Vault, never in Git, same vault-backend ClusterSecretStore
# as the other Marga secrets.
#
# This ONE secret serves two consumers, which is why it is templated:
#   * CloudNativePG reads `username` + `password` (it requires the secret to be
#     type kubernetes.io/basic-auth) to create and reconcile the role.
#   * The app's `web` container reads `uri` as DATABASE_URL.
# Keeping them in one object means the credential the operator sets and the
# credential the app dials can never drift apart.
#
# Vault path (KV v2, mount "kv"), key marga/db:
#   app_role_password = <random alphanumeric, >=24 chars>
#
# Seed it (alphanumeric only, so the value is URL-safe inside the URI):
#   PW=$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32)
#   vault kv put kv/marga/db app_role_password="$PW"
#
# Rotating it is safe and cheap: re-put the Vault key, let ESO refresh, and CNPG
# reconciles the role password. In-flight connections keep working until they
# are recycled. Unlike the Zitadel masterkey, nothing is encrypted with it.
apiVersion: external-secrets.io/v1beta1   # matches ESO 0.9.11 (as used by B-R1-01/02)
kind: ExternalSecret
metadata:
  name: marga-app-role
  namespace: marga
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore        # B-R1-11: Marga-scoped (was ClusterSecretStore/vault-backend)
    name: vault-marga
  target:
    name: marga-app-role
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      # CNPG rejects a passwordSecret that is not basic-auth.
      type: kubernetes.io/basic-auth
      data:
        username: "marga_app"
        password: "{{ .app_role_password }}"
        # B-R1-11 piece 3: sslmode=verify-full + sslrootcert = the CNPG CA.
        # Encrypts AND verifies that the server presents a certificate chaining
        # to marga-pg's own CA with a SAN matching the host below. Closes the
        # MITM gap no-verify left open (no-verify accepted ANY certificate).
        #
        # node-pg semantics, not libpq (this URI is consumed only by node-pg):
        # pg-connection-string reads the sslrootcert FILE into ssl.ca, which
        # REPLACES the default trust store (the bundled public CAs are not
        # trusted for this connection), and verify-full keeps
        # rejectUnauthorized on with hostname checking. The file is re-read
        # every time the pool opens a new physical connection, so a renewed CA
        # (kubelet refreshes the secret volume) is picked up without a restart.
        #
        # The CA file is mounted from CNPG's Secret marga-pg-ca, key ca.crt
        # ONLY (deployment.yaml, volume pg-ca, added by the previous commit). That Secret also holds ca.key;
        # the volume's items list keeps the key out of the pod.
        #
        # Host must be a SAN on CNPG's server certificate (DISCOVERY G8).
        uri: "postgresql://marga_app:{{ .app_role_password | urlquery }}@marga-pg-rw.marga.svc.cluster.local:5432/marga?sslmode=verify-full&sslrootcert=/etc/ssl/pgca/ca.crt"
  data:
    - secretKey: app_role_password
      remoteRef:
        key: marga/db              # mount-relative (store path=kv, v2)
        property: app_role_password
