# CloudNativePG Cluster. The operator generates the credentials in-cluster
# (Secret marga-pg-app) - they never touch Git. The app reads that Secret.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: marga-pg
  namespace: marga
spec:
  instances: 2                       # HA pair (tech-stack: HA + PITR). Drop to 1
                                     # for the very first bootstrap if you want a
                                     # lighter footprint, then scale up.
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4

  primaryUpdateStrategy: unsupervised

  # --- B-R1-08 NEW: keep bind parameters out of the server log --------------
  # The pgcrypto field key travels as a BIND PARAMETER on every statement that
  # touches case_file.visa_type or client.mobile (lib/field-crypto.ts, and
  # scripts/migrate.mjs for migration 0008). Nothing interpolates it into
  # statement text, so "the key is never in the log" rests entirely on the
  # server not logging parameters.
  #
  # log_parameter_max_length is the ONE setting that caps every
  # parameter-logging path at once: log_statement='all',
  # log_min_duration_statement=0, log_min_duration_sample, auto_explain. At 0,
  # parameters are never written to the log whatever else someone turns on
  # while debugging an unrelated problem six months from now.
  #
  # It is set HERE and not in the app because its GUC context is `superuser`:
  # marga_app cannot set it, so no amount of application code makes this true.
  # Measured before this change: setting=-1, boot_val=-1, source=default on
  # both instances (-1 means "log the parameter in full").
  #
  # COST, recorded rather than buried: no log line on this cluster will ever
  # show bind parameter values again, so debugging a parameterised statement
  # means getting the values from the application side. That is the deliberate
  # trade against a cluster where one debug setting writes the encryption key
  # into a log file nobody reads.
  #
  # log_parameter_max_length_on_error already defaults to 0 and is deliberately
  # NOT set here - scripts/crypto-invariants.mjs asserts it, so if anyone ever
  # changes it the check fails and says so.
  #
  # SIGHUP reload, not a restart: confirmed on the rig (pending_restart=false)
  # and to be confirmed on both instances after this applies.
  postgresql:
    parameters:
      log_parameter_max_length: "0"

  storage:
    # synology-iscsi-ext4 = the iSCSI CSI class WITH an explicit fsType (ext4).
    # The default "synology-iscsi-storage" sets no fsType, so provisioned PVs
    # have empty .spec.csi.fsType and the kubelet skips the fsGroup chown
    # (fsGroupPolicy: ReadWriteOnceWithFSType) - leaving the volume root-owned
    # and initdb failing with "Permission denied". Declaring fsType fixes it.
    storageClass: synology-iscsi-ext4
    size: 8Gi

  # Keep Postgres OFF the control-plane node (hp-master is memory-tight) and
  # spread the two instances across the workers. The workers carry no
  # "worker" role label (confirmed: kubectl get nodes shows ROLES <none>), so
  # we exclude the control-plane role instead - which hp-master DOES have -
  # rather than requiring a label that doesn't exist.
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist

  bootstrap:
    initdb:
      database: marga
      owner: marga
      # Empty schema per the ticket. Real migrations run from the app image
      # (initContainer) so the migration history lives with the code.

  # --- B-R1-03 NEW: the non-owning application role -------------------------
  # Declarative role management. The operator creates and reconciles this role
  # using its own superuser connection; nothing here can be done by the
  # migration, which has neither CREATEROLE nor superuser.
  #
  # Every attribute below is load-bearing:
  #   superuser: false   } either one would make Postgres skip RLS entirely for
  #   bypassrls: false   } this role, silently turning the boundary off.
  #   inRoles: []        - no membership in `marga`. Membership is a FULL bypass
  #                        path that neither of the flags above catches: a member
  #                        of the owner can SET ROLE into it and inherit owner DDL
  #                        plus the auth_lookup_owner carve-out (review finding M1).
  #
  # Migration 0003 re-asserts all four facts (superuser, bypassrls, table
  # ownership, role membership) at apply time and refuses to run if any drifted,
  # and assert_tenant_rls_complete() re-checks them at runtime. So the role's
  # safety is enforced in three places, not just declared here.
  managed:
    roles:
      - name: marga_app
        ensure: present
        comment: "Non-owning app role - RLS applies to it (B-R1-03 tenant isolation)"
        login: true
        superuser: false
        bypassrls: false
        createdb: false
        createrole: false
        replication: false
        inherit: true
        inRoles: []
        connectionLimit: 20        # 2 replicas x pool max 5, with headroom
        passwordSecret:
          name: marga-app-role     # produced by externalsecret-app-role.yaml

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  monitoring:
    enablePodMonitor: true            # kube-prometheus-stack picks this up.

  # B-R1-09: continuous WAL archiving + base backups through the Barman Cloud
  # plugin to ObjectStore marga-pg-store (backup.yaml). isWALArchiver makes the
  # plugin the archive_command target. Until this existed, archive_mode=on with
  # CNPG's wal-archive accepted every segment and sent it NOWHERE, while
  # pg_stat_archiver.archived_count kept rising (measured 4 Oct 2026). That
  # counter is not backup evidence; the plugin metrics are.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: marga-pg-store
