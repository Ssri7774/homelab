# B-R2-DOCS D3: marga-web's credentials for the document store (marga-docs),
# and the CA that signs the store's TLS certificate.
#
# Vault kv/marga/docs (seeded by the D3 bundle's qc/live/10-vault-docs.sh):
#   marga_web_access_key  GK + 24 hex      (Garage key "marga-web")
#   marga_web_secret_key  64 hex
#   ca_crt                the docs CA certificate (public; a copy of the one
#                         in kv/marga-docs/store, whose CA KEY and Garage RPC
#                         secret this namespace cannot read)
# Garage key "marga-web" has read + write on bucket marga-documents ONLY and
# is NOT owner (qc/live/30 gates on `garage key info marga-web`).
#
# MOUNTED AS A VOLUME (DOCS_S3_DIR), never env: env is part of the container
# spec, which containerd keeps on the node's disk. lib/doc-store.ts reads the
# three files and refuses to start if a DOCS_S3_ACCESS*/SECRET* env var exists.
# The CA goes to the S3 client's own https agent, not NODE_EXTRA_CA_CERTS.
#
# deletionPolicy: Retain, like every Marga secret: a sealed Vault must not take
# the store's credentials away from a running app.
apiVersion: external-secrets.io/v1beta1   # matches ESO 0.9.11
kind: ExternalSecret
metadata:
  name: marga-docs-s3
  namespace: marga
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore        # B-R1-11: the Marga-scoped store, kv/marga/* only
    name: vault-marga
  target:
    name: marga-docs-s3
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: {key: marga/docs, property: marga_web_access_key}
    - secretKey: SECRET_ACCESS_KEY
      remoteRef: {key: marga/docs, property: marga_web_secret_key}
    - secretKey: ca.crt
      remoteRef: {key: marga/docs, property: ca_crt}
