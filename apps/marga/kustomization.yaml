apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: marga
resources:
  - namespace.yaml
  - externalsecret.yaml
  - externalsecret-oidc.yaml     # B-R1-02: OIDC client creds + session key (Vault)
  - externalsecret-authca.yaml   # B-R1-02: CA to trust the in-cluster TLS hop to the issuer
  - externalsecret-app-role.yaml # B-R1-03: marga_app password + DATABASE_URL (Vault)
  - configmap.yaml
  - postgres-cluster.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Pin the image in ONE place. Promoting a build = a reviewed one-line change to
# newTag here (the founder deploy gate). Revert the commit to roll back.
images:
  - name: __IMAGE__
    newName: forgejo.whatsoever.au/ssri7774/marga-platform
    newTag: 3691554ce8cb261d834dcf3c0cc09d3813631661
