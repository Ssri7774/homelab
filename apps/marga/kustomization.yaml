apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: marga
resources:
  - namespace.yaml
  - serviceaccount-eso.yaml     # B-R1-11: identity for the Marga-scoped Vault role
  - secretstore-vault-marga.yaml # B-R1-11: namespaced store, kv/marga/* only
  - externalsecret.yaml
  - externalsecret-oidc.yaml     # B-R1-02: OIDC client creds + session key (Vault)
  - externalsecret-authca.yaml   # B-R1-02: CA to trust the in-cluster TLS hop to the issuer
  - externalsecret-app-role.yaml # B-R1-03: marga_app password + DATABASE_URL (Vault)
  - externalsecret-field-key.yaml # B-R1-08: pgcrypto field key (Vault)
  - configmap.yaml
  - postgres-cluster.yaml
  - podmonitor.yaml              # B-R1-09: CNPG scrape that Prometheus actually selects
  - backup.yaml                 # B-R1-09: backup creds + ObjectStore + ScheduledBackup
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml          # B-R1-11: default-deny + explicit allows

# Pin the image in ONE place. Promoting a build = a reviewed one-line change to
# newTag here (the founder deploy gate). Revert the commit to roll back.
images:
  - name: __IMAGE__
    newName: forgejo.whatsoever.au/ssri7774/marga-platform
    newTag: 26a0ab47146b1f7427b917957eed54bd91f3e6e0
