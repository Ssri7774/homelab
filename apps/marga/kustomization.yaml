apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: marga
resources:
  - namespace.yaml
  - externalsecret.yaml
  - configmap.yaml
  - postgres-cluster.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Pin the image in ONE place. Promoting a build = a reviewed one-line change to
# newTag here (the founder deploy gate). Revert the commit to roll back.
images:
  - name: __IMAGE__
    newName: forgejo.whatsoever.au/ssri7774/marga-platform
    newTag: "747a5313bbc2fefdd58425d58e121dd812612ed8"   # first build; bump via reviewed commit to deploy new images
