# B-R1-02: CA-only bundle so the marga app trusts the in-cluster TLS hop to the
# Zitadel issuer host (see apps/zitadel/externalsecret-authtls.yaml). ca.crt is
# public (not sensitive); sourced from the same Vault entry for one pattern.
# Mounted into marga-web and pointed at by NODE_EXTRA_CA_CERTS.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zitadel-auth-ca
  namespace: marga
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: zitadel-auth-ca
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ca.crt
      remoteRef:
        key: marga/authtls
        property: ca
