# B-R1-02 NEW: the Marga app's OIDC client credentials + session key, from Vault
# via the existing vault-backend ClusterSecretStore. Kept in a SEPARATE Vault
# path from the IdP's server secrets (kv/marga/zitadel) - this is the app's
# CLIENT identity, not Zitadel's server identity.
#
# Vault path (KV v2, mount "kv"), key marga/oidc:
#   client_id       = <the Zitadel app's OIDC client id>
#   client_secret   = <the Zitadel app's OIDC client secret>   # confidential client
#   session_secret  = <random >=32 chars>   # iron-session cookie encryption key
#
# session_secret is generate-once like the masterkey: rotating it invalidates
# all live sessions (acceptable - everyone just re-logs-in). Vault backs it up.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: marga-oidc
  namespace: marga
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: marga-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: marga/oidc
        property: client_id
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: marga/oidc
        property: client_secret
    - secretKey: SESSION_SECRET
      remoteRef:
        key: marga/oidc
        property: session_secret
