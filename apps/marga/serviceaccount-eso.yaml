# B-R1-11 piece 1: the identity Marga's SecretStore presents to Vault.
#
# No pod runs as this ServiceAccount. ESO's controller asks the API server for a
# short-lived token for it (TokenRequest) and hands that token to Vault's
# kubernetes auth, which binds it to role marga-role
# (infrastructure/terraform/vault/marga.tf: bound to exactly marga/marga-eso).
#
# automountServiceAccountToken: false so that a pod that names this SA by
# mistake does not get a long-lived token on disk.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: marga-eso
  namespace: marga
  labels:
    app.kubernetes.io/part-of: marga
automountServiceAccountToken: false
