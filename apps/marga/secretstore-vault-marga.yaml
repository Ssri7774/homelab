# B-R1-11 piece 1: Marga-scoped secret store (least privilege).
#
# A NAMESPACED SecretStore, so only ExternalSecrets in `marga` can use it, and
# it authenticates as marga/marga-eso -> Vault role marga-role -> marga-policy:
# read kv/data/marga/* only, with kv/data/marga/zitadel explicitly denied.
# Every Marga ExternalSecret in this directory points here instead of the
# cluster-wide vault-backend store.
#
# vault-backend (apps/external-secrets/clustersecretstore.yaml) still serves
# every other app, including the zitadel and marga-backup namespaces, which read
# kv/marga/zitadel, kv/marga/authtls and kv/marga/backup through it. The next
# commit bars the `marga` namespace from using vault-backend at all. See README
# flag F2 for what remains open (other namespaces can still read kv/marga/*).
#
# server/path/version/mountPath mirror vault-backend exactly, so the only things
# that differ from a store already proven to work are the role and the SA.
apiVersion: external-secrets.io/v1beta1   # ESO 0.9.11, same as every ExternalSecret here
kind: SecretStore
metadata:
  name: vault-marga
  namespace: marga
  labels:
    app.kubernetes.io/part-of: marga
spec:
  provider:
    vault:
      server: "http://vault-vault.vault.svc.cluster.local:8200"
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "marga-role"
          serviceAccountRef:
            name: "marga-eso"        # same namespace as the store (namespaced store)
