# B-R1-08 NEW: the pgcrypto field-encryption key.
#
# Encrypts case_file.visa_type and client.mobile. Those two columns are the only
# thing standing between an offsite database dump and a readable immigration
# status, which is sensitive information under the Privacy Act. B-R1-09 is about
# to start shipping those dumps on a schedule.
#
# Vault path (KV v2, mount "kv"), key marga/pgcrypto:
#   field_key = 48 chars of entropy
#
# ---------------------------------------------------------------------------
# ALREADY SEEDED. 3 October, version 1, 48 characters.
# ---------------------------------------------------------------------------
# Recorded here so nobody re-runs the seeding command thinking the path is
# empty. The key was generated INSIDE the Vault pod so it never crossed the
# network, never reached argv, and never touched a shell history:
#
#   printf '%s' "$VTOK" | kubectl -n vault exec -i vault-vault-0 -- sh -c \
#     'read -r T; export VAULT_TOKEN="$T" VAULT_ADDR=http://127.0.0.1:8200
#      tr -dc "A-Za-z0-9" < /dev/urandom | head -c 48 \
#        | vault kv put kv/marga/pgcrypto field_key=-'
#
# The root token goes in on stdin into a variable of that one process for the
# same reason. `vault kv put field_key=-` reads the value from stdin.
#
# ---------------------------------------------------------------------------
# GENERATE ONCE. NEVER RE-PUT.
# ---------------------------------------------------------------------------
# This is the Zitadel masterkey rule, and it binds harder here because the
# failure is silent rather than loud. Re-putting this key does not rotate
# anything: it makes every row encrypted under the old key permanently
# unreadable, and the app will raise "Wrong key or corrupt data" on the next
# read of a row it previously served fine.
#
# Rotation, when it is ever needed, means decrypting with the old key and
# re-encrypting with the new one, row by row, with BOTH keys live at once. That
# procedure is written down before the key exists rather than after it is
# needed. It is not this manifest.
#
# The Vault barrier was backed up immediately after this key was created
# (vault-data-20261003-0349.tar). The 26 September tarball predates the key and
# does not contain it.
#
# ---------------------------------------------------------------------------
# WHY deletionPolicy: Retain MATTERS MORE FOR THIS ONE
# ---------------------------------------------------------------------------
# Same as the other Marga secrets, but the consequence differs. If this
# ExternalSecret is deleted while Vault is sealed or unreachable, Retain keeps
# the Kubernetes Secret in place and the app keeps decrypting. Without it the
# app would start, fail every read of an encrypted column, and look like data
# corruption rather than a missing secret.
#
# This is not hypothetical and it is not rare. Vault was sealed 29 September to
# 1 October, and sealed itself again on 2 October and stayed that way for 26
# hours - found only because a Flux health check was blocking this deploy. On
# both occasions every Marga ExternalSecret was SecretSyncedError while the app
# carried on serving from its retained Secrets. Retain is what bought that.
apiVersion: external-secrets.io/v1beta1   # matches ESO 0.9.11
kind: ExternalSecret
metadata:
  name: marga-field-key
  namespace: marga
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore        # B-R1-11: Marga-scoped (was ClusterSecretStore/vault-backend)
    name: vault-marga
  target:
    name: marga-field-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: FIELD_KEY
      remoteRef:
        key: marga/pgcrypto          # mount-relative (store path=kv, v2)
        property: field_key
