apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "70.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  values:
    grafana:
      admin:
        existingSecret: grafana-admin-secret
        passwordKey: admin-password
      # Authentik SSO (app slug "grafana"). client_id/secret come from the
      # grafana-oauth Secret (ESO <- Vault kv/grafana) as GF_AUTH_GENERIC_OAUTH_*.
      # The local admin login stays enabled as break-glass if Authentik is down.
      envFromSecret: grafana-oauth
      grafana.ini:
        server:
          root_url: https://grafana.whatsoever.au
        auth:
          signout_redirect_url: https://auth.whatsoever.au/application/o/grafana/end-session/
          oauth_auto_login: false
        auth.generic_oauth:
          enabled: true
          name: authentik
          allow_sign_up: true
          use_pkce: true
          scopes: openid profile email entitlements
          auth_url: https://auth.whatsoever.au/application/o/authorize/
          token_url: https://auth.whatsoever.au/application/o/token/
          api_url: https://auth.whatsoever.au/application/o/userinfo/
          # Authentik application entitlements -> Grafana role; no entitlement = Viewer
          role_attribute_path: "contains(entitlements[*], 'Grafana Admins') && 'Admin' || contains(entitlements[*], 'Grafana Editors') && 'Editor' || 'Viewer'"
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - grafana.whatsoever.au
    prometheus:
      prometheusSpec:
        retention: 7d
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi
    alertmanager:
      alertmanagerSpec:
        externalUrl: "http://alertmanager.whatsoever.au"
        # B-R1-VAULT: the operator default (OnNamespace) silently adds
        # namespace="monitoring" to every AlertmanagerConfig route, so alerts
        # from vault/, external-secrets/ etc. went to "null". Opt-in is by the
        # notify="slack" label instead (see alertmanager-config.yaml).
        alertmanagerConfigMatcherStrategy:
          type: None
        alertmanagerConfigSelector:
          matchLabels:
            alertmanagerConfig: slack
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 2Gi
      ingress:
          enabled: true
          ingressClassName: traefik
          hosts:
            - alertmanager.whatsoever.au

    prometheus-node-exporter:
      extraArgs:
        - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
      extraVolumes:
        - name: textfile-collector
          hostPath:
            path: /var/lib/node_exporter/textfile_collector
            type: DirectoryOrCreate
      extraVolumeMounts:
        - name: textfile-collector
          mountPath: /var/lib/node_exporter/textfile_collector
          readOnly: true
