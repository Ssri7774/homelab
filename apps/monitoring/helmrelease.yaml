apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "70.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  values:
    grafana:
      adminPassword: "homelab123"
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - grafana.whatsoever.au
    prometheus:
      prometheusSpec:
        retention: 7d
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi
    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 2Gi
    config:
      global:
        resolve_timeout: 5m
      route:
        group_by: ["alertname"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 1h
        receiver: slack
      receivers:
        - name: slack
          slack_configs:
            - api_url_secret:
                name: alertmanager-slack-secret
                key: slack_webhook
              channel: "#alerts"
              title: '{{ .GroupLabels.alertname }}'
              text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

