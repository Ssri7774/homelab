apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-slack-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: alertmanager-slack-secret
    creationPolicy: Owner
  data:
    - secretKey: slack_webhook
      remoteRef:
        key: alertmanager
        property: slack_webhook
    # B-R1-VAULT 2d: healthchecks.io ping URL for the Watchdog dead man's switch.
    # Add this property to kv/alertmanager in Vault BEFORE pushing, or ESO fails
    # the whole Secret (Slack webhook included) until it exists.
    - secretKey: healthchecks_ping_url
      remoteRef:
        key: alertmanager
        property: healthchecks_ping_url

