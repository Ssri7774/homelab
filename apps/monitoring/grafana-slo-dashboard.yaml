apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-slo-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  slo-dashboard.json: |
    {
      "title": "n8n SLO Dashboard",
      "uid": "n8n-slo",
      "timezone": "browser",
      "panels": [
        {
          "id": 1,
          "title": "Availability (SLI)",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "targets": [{
            "expr": "1 - slo:n8n:error_ratio",
            "legendFormat": "Availability"
          }],
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "orientation": "auto",
            "colorMode": "background"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "steps": [
                  {"color": "red", "value": 0},
                  {"color": "yellow", "value": 0.99},
                  {"color": "green", "value": 0.995}
                ]
              }
            }
          }
        },
        {
          "id": 2,
          "title": "Error Budget Remaining",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "targets": [{
            "expr": "1 - (slo:n8n:error_ratio / 0.005)",
            "legendFormat": "Budget Remaining"
          }],
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "colorMode": "background"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "steps": [
                  {"color": "red", "value": 0},
                  {"color": "yellow", "value": 0.25},
                  {"color": "green", "value": 0.5}
                ]
              }
            }
          }
        },
        {
          "id": 3,
          "title": "Burn Rate (5m vs 1h)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "targets": [
            {
              "expr": "slo:n8n:burnrate5m",
              "legendFormat": "5m burn rate"
            },
            {
              "expr": "slo:n8n:burnrate1h",
              "legendFormat": "1h burn rate"
            },
            {
              "expr": "vector(14.4)",
              "legendFormat": "Critical threshold"
            },
            {
              "expr": "vector(6)",
              "legendFormat": "Warning threshold"
            }
          ]
        },
        {
          "id": 4,
          "title": "Request Rate by Status",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "targets": [
            {
              "expr": "sum by (code) (rate(traefik_service_requests_total{exported_service=\"n8n-n8n-main-5678@kubernetes\"}[5m]))",
              "legendFormat": "{{code}}"
            }
          ]
        }
      ],
      "schemaVersion": 36,
      "version": 1
    }

