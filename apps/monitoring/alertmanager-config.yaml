apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: slack-config
  namespace: monitoring
  labels:
    alertmanagerConfig: slack
spec:
  route:
    receiver: slack
    # Only alerts that opt in reach Slack. Without this, matcherStrategy None
    # would forward every default kube-prometheus-stack alert (k3s fires several
    # false positives) and a noisy channel gets muted, which is the void again.
    matchers:
      - name: notify
        value: slack
        matchType: "="
    groupBy: ["alertname"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 1h
  receivers:
    - name: slack
      slackConfigs:
        - apiURL:
            name: alertmanager-slack-secret
            key: slack_webhook
          channel: "#alerts"
          sendResolved: true
          title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
          text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}'

