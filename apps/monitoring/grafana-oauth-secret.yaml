# Grafana's Authentik (OIDC) client credentials, from Vault kv/grafana.
# Key names ARE Grafana env vars: the HelmRelease loads this whole Secret with
# grafana.envFromSecret, so Grafana reads them as
# [auth.generic_oauth] client_id / client_secret without them touching Git.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-oauth
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: grafana-oauth
    creationPolicy: Owner
  data:
    - secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
      remoteRef:
        key: grafana
        property: oauth_client_id
    - secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
      remoteRef:
        key: grafana
        property: oauth_client_secret
