# Everything the offsite job needs, from Vault kv/marga/backup.
#
# DEV-002 condition 1: restic_password lives ONLY in Vault. It is never written
# to Google Drive, never to KeePass (the KeePass database is on that same Google
# account), never pasted into chat. See VAULT-SEEDING.md for the escrow rule
# this forces on future Vault barrier backups.
#
# DEV-002 condition 2: the [gdrive] remote is scope = drive.file on a DEDICATED
# Google OAuth client (Cloud project "marga-backup", Desktop app, In production).
# drive.file is per OAuth CLIENT: on rclone's shared default client it would
# also see everything any other default-client rclone ever uploaded (Sri's
# GDrive: remote uses it with full scope). With its own client this token sees
# only the restic repo. The token's refresh needs the same client_id/secret.
#
# The Garage key here is the READ-ONLY "offsite" key: the offsite job cannot
# modify or delete the staging copy even if its token leaks.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: offsite-backup
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-backend}
  target:
    name: offsite-backup
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        RESTIC_PASSWORD: "{{ .restic_password }}"
        HC_URL: "{{ .hc_url }}"
        rclone.conf: |
          [garage]
          type = s3
          provider = Other
          endpoint = https://garage.marga-backup.svc
          region = us-east-1
          access_key_id = {{ .offsite_ak }}
          secret_access_key = {{ .offsite_sk }}

          [gdrive]
          type = drive
          scope = drive.file
          client_id = {{ .gdrive_client_id }}
          client_secret = {{ .gdrive_client_secret }}
          token = {{ .gdrive_token }}
        ca.crt: "{{ .ca_crt }}"
  data:
    - {secretKey: restic_password, remoteRef: {key: marga/backup, property: restic_password}}
    - {secretKey: hc_url,          remoteRef: {key: marga/backup, property: healthchecks_ping_url}}
    - {secretKey: offsite_ak,      remoteRef: {key: marga/backup, property: offsite_access_key}}
    - {secretKey: offsite_sk,      remoteRef: {key: marga/backup, property: offsite_secret_key}}
    - {secretKey: gdrive_token,    remoteRef: {key: marga/backup, property: gdrive_token}}
    - {secretKey: gdrive_client_id,     remoteRef: {key: marga/backup, property: gdrive_client_id}}
    - {secretKey: gdrive_client_secret, remoteRef: {key: marga/backup, property: gdrive_client_secret}}
    - {secretKey: ca_crt,          remoteRef: {key: marga/backup, property: ca_crt}}
