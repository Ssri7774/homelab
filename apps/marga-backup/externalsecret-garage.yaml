# Garage node secret + the backup CA keypair, from Vault kv/marga/backup.
# Seeded per VAULT-SEEDING.md BEFORE this is pushed (B-R1-VAULT lesson: add the
# Vault property before the ExternalSecret that reads it).
#
# Why the CA lives in Vault and not in a cert-manager self-signed chain: the
# ObjectStores in `marga` and `zitadel` must trust it (endpointCA), and a
# cert-manager Secret cannot cross namespaces. Vault + ESO can deliver ca.crt
# anywhere. Same pattern as kv/marga/authtls (B-R1-02).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: garage-node
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-backend}
  target:
    name: garage-node
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: GARAGE_RPC_SECRET
      remoteRef: {key: marga/backup, property: garage_rpc_secret}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backup-ca
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault-backend}
  target:
    name: backup-ca
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef: {key: marga/backup, property: ca_crt}
    - secretKey: tls.key
      remoteRef: {key: marga/backup, property: ca_key}
