apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: marga-backup
resources:
  - namespace.yaml
  - externalsecret-garage.yaml   # rpc secret + CA keypair (Vault kv/marga/backup)
  - tls.yaml                     # CA Issuer + server cert for the TLS sidecar
  - garage.yaml                  # PVC + ConfigMaps + Deployment + Service
  - externalsecret-offsite.yaml  # restic key + rclone.conf + healthchecks URL
  - cronjob-offsite.yaml         # Garage -> restic (AES-256) -> Google Drive
