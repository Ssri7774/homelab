apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  releaseName: cert-manager
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.x"          # replaces the EOL v1.5.3 static install
      sourceRef:
        kind: HelmRepository
        name: jetstack
  values:
    crds:
      enabled: true
      keep: true
    # DNS-01 self-check. This network is hostile to DNS: Technitium shadows
    # whatsoever.au internally (split-horizon), 8.8.8.8 is hijacked, and 1.1.1.1
    # only returns the record with full recursion (RD=1) which cert-manager's
    # check doesn't get here. Cloudflare's AUTHORITATIVE nameservers answer the
    # TXT directly (RD=0) and aren't a hijack-prone public-resolver IP, so we
    # point the check straight at them.
    #   naya.ns.cloudflare.com = 108.162.194.242 (confirmed reachable + answers TXT)
    # Add rick.ns.cloudflare.com's IP here too for redundancy once resolved.
    # (Slightly coupled to the zone's NS IPs; fine for a homelab. Longer term a
    # dedicated in-cluster DoT resolver would be the fully robust option.)
    extraArgs:
      - --dns01-recursive-nameservers-only
      - --dns01-recursive-nameservers=108.162.194.242:53
