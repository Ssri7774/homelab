apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  releaseName: cert-manager
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.x"          # replaces the EOL v1.5.3 static install
      sourceRef:
        kind: HelmRepository
        name: jetstack
  values:
    crds:
      enabled: true
      keep: true
    # DNS-01 self-check uses a public recursive resolver (1.1.1.1) because
    # Technitium shadows whatsoever.au internally (split-horizon) and 8.8.8.8 is
    # hijacked on this network. The real blocker before was NOT the resolver - it
    # was a stale `_acme-challenge.whatsoever.au` CNAME left in Cloudflare from old
    # Cloudways hosting, which cert-manager followed; that's been deleted. 1.1.1.1
    # is a stable anycast IP (more robust than pinning the zone's authoritative NS).
    extraArgs:
      - --dns01-recursive-nameservers-only
      - --dns01-recursive-nameservers=1.1.1.1:53
