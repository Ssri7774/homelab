# cert-manager INSTALL only (HelmRelease v1.21 + its Helm repo + namespace).
# The config (ClusterIssuers/Certificate/TLSStore) lives in ../cert-manager-config
# and is reconciled by a separate Flux Kustomization that dependsOn this one, so
# the CRDs + webhook exist before those CRs apply.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
