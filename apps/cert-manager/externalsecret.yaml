# Cloudflare API token for the DNS-01 solver, from Vault.
# Create a Cloudflare token scoped to: Zone -> DNS -> Edit, limited to the
# whatsoever.au zone (least privilege). Then seed Vault:
#   vault kv put kv/cloudflare/api-token token=<CLOUDFLARE_API_TOKEN>
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api-token
      remoteRef:
        key: cloudflare/api-token
        property: token
