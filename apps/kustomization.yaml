apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - n8n
  - technitium
  - vault
  - external-secrets
  - milvus-operator
  - monitoring
  - rabbitmq-operator
  - rabbitmq
  - milvus
  - ollama
  - cloudnative-pg
  - tailscale-operator
  - forgejo-runner
  # Marga: isolated Flux Kustomization -> ./apps/marga (do NOT add a bare `- marga`).
