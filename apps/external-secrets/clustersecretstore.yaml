apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  # B-R1-11 piece 1: the `marga` namespace may NOT use this store. Its
  # ExternalSecrets go through SecretStore marga/vault-marga (role marga-role,
  # kv/marga/* only). Without this condition any ExternalSecret created in
  # `marga` could still name this store and read every app's secrets
  # (eso-policy = kv/data/*), and the scoped role would be decoration.
  # Every other namespace is unaffected.
  # Rollback: revert this commit BEFORE reverting the one that repointed the
  # Marga ExternalSecrets, or they fail to sync in between (Secrets are Retain).
  conditions:
    - namespaceSelector:
        matchExpressions:
          - {key: kubernetes.io/metadata.name, operator: NotIn, values: [marga]}
  provider:
    vault:
      server: "http://vault-vault.vault.svc.cluster.local:8200"
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso-role"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"