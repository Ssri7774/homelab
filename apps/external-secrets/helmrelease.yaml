apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: external-secrets
  chart:
    spec:
      chart: external-secrets
      version: "0.9.11"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
  install:
    createNamespace: true
  values:
    installCRDs: true
    fullnameOverride: "external-secrets"
    # B-R1-VAULT 2c: let Prometheus scrape ESO's controller metrics
    # (externalsecret_status_condition etc. on :8080). The release label is what
    # kube-prometheus-stack's serviceMonitorSelector matches.
    # In chart 0.9.11, serviceMonitor.enabled renders its OWN external-secrets-metrics
    # Service; also setting metrics.service.enabled renders a second one with the
    # same name and the upgrade fails ("already registered id"). Use only this.
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack