apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: vault
  storageNamespace: vault
  chart:
    spec:
      chart: vault
      version: "0.28.0"
      sourceRef:
        kind: HelmRepository
        name: hashicorp
  install:
    createNamespace: true
  values:
    server:
      standalone:
        enabled: true
      dataStorage:
        enabled: true
        size: 2Gi
        storageClass: local-path
    ui:
      enabled: true
      serviceType: ClusterIP
