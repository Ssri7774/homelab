apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: milvus-etcd-pvc
  namespace: milvus-operator
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: homelab-etcd
  namespace: milvus-operator
spec:
  serviceName: homelab-etcd
  replicas: 1
  selector:
    matchLabels:
      app: homelab-etcd
  template:
    metadata:
      labels:
        app: homelab-etcd
    spec:
      securityContext:
        runAsUser: 0
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.5
          command:
            - etcd
            - --data-dir=/etcd-data
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://homelab-etcd.milvus-operator:2379
            - --listen-peer-urls=http://0.0.0.0:2380
            - --initial-advertise-peer-urls=http://homelab-etcd.milvus-operator:2380
          volumeMounts:
            - name: etcd-data
              mountPath: /etcd-data
      volumes:
        - name: etcd-data
          persistentVolumeClaim:
            claimName: milvus-etcd-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: homelab-etcd
  namespace: milvus-operator
spec:
  selector:
    app: homelab-etcd
  ports:
    - name: client
      port: 2379
    - name: peer
      port: 2380

