apiVersion: milvus.io/v1alpha1
kind: MilvusCluster
metadata:
  name: homelab
  namespace: milvus-operator
spec:
  dependencies:
    etcd:
      external: true
      endpoints:
        - homelab-etcd.milvus-operator:2379
    pulsar:
      inCluster:
        values:
          components:
            autorecovery: false
            functions: false
            toolset: false
            pulsar_manager: false
          monitoring:
            prometheus: false
            grafana: false
            node_exporter: false
            alert_manager: false
          proxy:
            replicaCount: 1
            resources:
              requests:
                cpu: "0.01"
                memory: 256Mi
            configData:
              PULSAR_MEM: "-Xms256m -Xmx256m"
          bookkeeper:
            replicaCount: 2
            resources:
              requests:
                cpu: "0.01"
                memory: 256Mi
            configData:
              PULSAR_MEM: "-Xms256m -Xmx256m -XX:MaxDirectMemorySize=256m"
          zookeeper:
            replicaCount: 1
            resources:
              requests:
                cpu: "0.01"
                memory: 256Mi
            configData:
              PULSAR_MEM: "-Xms256m -Xmx256m"
          broker:
            replicaCount: 1
            resources:
              requests:
                cpu: "0.01"
                memory: 256Mi
            configData:
              PULSAR_MEM: "-Xms256m -Xmx256m"
    storage:
      external: true
      type: MinIO
      endpoint: homelab-minio.milvus-operator:9000
      secretRef: milvus-minio-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: milvus-attu
  namespace: milvus-operator
spec:
  selector:
    matchLabels:
      app: milvus-attu
  template:
    metadata:
      labels:
        app: milvus-attu
    spec:
      containers:
        - name: attu
          image: zilliz/attu:v2.4
          env:
            - name: MILVUS_URL
              value: homelab-milvus.milvus-operator:19530
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: milvus-attu
  namespace: milvus-operator
spec:
  selector:
    app: milvus-attu
  ports:
    - port: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: milvus-attu
  namespace: milvus-operator
spec:
  ingressClassName: traefik
  rules:
    - host: milvus.whatsoever.au
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: milvus-attu
                port:
                  number: 3000
