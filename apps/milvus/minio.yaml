apiVersion: v1
kind: Secret
metadata:
  name: milvus-minio-secret
  namespace: milvus-operator
type: Opaque
stringData:
  accesskey: minioadmin
  secretkey: minioadmin
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: milvus-minio-pvc
  namespace: milvus-operator
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-minio
  namespace: milvus-operator
spec:
  selector:
    matchLabels:
      app: homelab-minio
  template:
    metadata:
      labels:
        app: homelab-minio
    spec:
      securityContext:
        runAsUser: 0
      containers:
        - name: minio
          image: minio/minio:RELEASE.2023-03-20T20-16-18Z
          args:
            - server
            - /export
          env:
            - name: MINIO_ACCESS_KEY
              value: minioadmin
            - name: MINIO_SECRET_KEY
              value: minioadmin
          volumeMounts:
            - name: minio-data
              mountPath: /export
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: milvus-minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: homelab-minio
  namespace: milvus-operator
spec:
  selector:
    app: homelab-minio
  ports:
    - port: 9000

